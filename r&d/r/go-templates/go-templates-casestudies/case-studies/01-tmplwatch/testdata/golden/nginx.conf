# Managed by tmplwatch. Do not edit by hand.
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;
    keepalive_timeout 65;

    upstream api {
        least_conn;
        server 10.0.1.10:8080 max_fails=3 fail_timeout=10s;
        server 10.0.1.11:8080 max_fails=3 fail_timeout=10s;
        server 10.0.1.12:8080 max_fails=3 fail_timeout=10s;
        keepalive 16;
    }

    upstream auth {
        least_conn;
        server 10.0.3.5:9000 max_fails=3 fail_timeout=10s;
        keepalive 16;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name api.example.internal;
        ssl_certificate     /etc/nginx/tls/api.example.internal.crt;
        ssl_certificate_key /etc/nginx/tls/api.example.internal.key;
        client_max_body_size 10m;

        location / {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name auth.example.internal;
        ssl_certificate     /etc/nginx/tls/auth.example.internal.crt;
        ssl_certificate_key /etc/nginx/tls/auth.example.internal.key;
        client_max_body_size 1m;

        location / {
            proxy_pass http://auth;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
