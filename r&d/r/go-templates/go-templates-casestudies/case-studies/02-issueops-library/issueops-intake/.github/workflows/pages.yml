# pages.yml: build the intake site from the issue forms and deploy it.
# The form page is generated by pagegen -intake from .github/ISSUE_TEMPLATE,
# so any change to a form redeploys the page that mirrors it.
name: pages

on:
  push:
    branches: [main]
    paths:
      - ".github/ISSUE_TEMPLATE/**"
      - "schema/**"
      - "internal/site/**"
      - "cmd/pagegen/**"
      - "lab/**"
      - "flags.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: intake-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOFLAGS: -mod=mod
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ vars.GO_VERSION || '1.24.x' }}
          cache: false
      - name: Test
        run: go test ./...
      - name: Render site
        run: |
          go build -trimpath -o bin/pagegen ./cmd/pagegen
          bin/pagegen -intake -flags flags.json -repo "$GITHUB_REPOSITORY" -o _site
      - name: Build wasm lab
        run: lab/build.sh _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
