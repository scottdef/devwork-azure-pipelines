# Generated by tmplforge new cicd repository_dispatch.
# Send an event (needs a token that may write to this repository):
#   gh api repos/OWNER/REPO/dispatches -f event_type=tmplforge-render -f 'client_payload[environment]=...' -f 'client_payload[dry_run]=...' -f 'client_payload[replicas]=...' -f 'client_payload[note]=...'
name: repository-dispatch

on:
  repository_dispatch:
    types: ["tmplforge-render","tmplforge-release"]

permissions:
  contents: read

jobs:
  handle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ vars.GO_VERSION || '1.24.x' }}
      - name: handle ${{ github.event.action }}
        env:
          EVENT: ${{ github.event.action }}
          INPUT_ENVIRONMENT: ${{ github.event.client_payload.environment }}
          INPUT_DRY_RUN: ${{ github.event.client_payload.dry_run }}
          INPUT_REPLICAS: ${{ github.event.client_payload.replicas }}
          INPUT_NOTE: ${{ github.event.client_payload.note }}
        run: |
          printf 'event=%s\n' "$EVENT"
          printf 'environment=%s\n' "$INPUT_ENVIRONMENT"
          printf 'dry_run=%s\n' "$INPUT_DRY_RUN"
          printf 'replicas=%s\n' "$INPUT_REPLICAS"
          printf 'note=%s\n' "$INPUT_NOTE"
          go run ./cmd/tmplforge
