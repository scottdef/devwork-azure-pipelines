# Generated by tmplforge from catalog/workflow.yml.tmpl
name: ci

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest","macos-latest"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ vars.GO_VERSION || '1.24.x' }}
      - name: "vet"
        run: "go vet ./..."
      - name: "test"
        run: "go test -race ./..."
