# Generated by tmplforge new cicd tag.
# Creates an annotated tag from a workflow_dispatch input. The push uses the
# issueops-autoadmin-app token so that it triggers the tag-driven release
# workflow (pushes made with GITHUB_TOKEN start no workflows).
name: tag

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to tag, e.g. v1.2.3"
        type: string
        required: true
      environment:
        description: "Environment"
        type: choice
        required: true
        default: "beta"
        options: ["beta","prod"]
      dry_run:
        description: "Dry run"
        type: boolean
        required: false
        default: true
      replicas:
        description: "Replicas"
        type: number
        required: false
        default: 2
      note:
        description: "Note"
        type: string
        required: false

permissions:
  contents: read

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
      - uses: actions/checkout@v6
        with:
          token: ${{ steps.app.outputs.token }}
          fetch-depth: 0
      - name: tag
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_REPLICAS: ${{ inputs.replicas }}
          INPUT_NOTE: ${{ inputs.note }}
        run: |
          case "$INPUT_VERSION" in
          v[0-9]*.[0-9]*.[0-9]*) ;;
          *) echo "version must look like v1.2.3, got: $INPUT_VERSION" >&2; exit 1 ;;
          esac
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$INPUT_VERSION" -m "release $INPUT_VERSION"
          git push origin "refs/tags/$INPUT_VERSION"
