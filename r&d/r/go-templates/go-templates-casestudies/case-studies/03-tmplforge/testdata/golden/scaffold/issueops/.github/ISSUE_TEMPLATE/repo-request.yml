# Generated by tmplforge new issueops repo-request. Parsed by
# .github/workflows/repo-request-parse.yml via cmd/repo-request-parse.
name: "Repo request"
description: "IssueOps request: Repo request"
title: "[repo-request] "
labels: ["repo-request","issueops"]
body:
  - type: markdown
    attributes:
      value: "Fill in every field. A bot parses this issue; edit it to re-run validation."
  - type: input
    id: repo_name
    attributes:
      label: "Repo name"
    validations:
      required: true
  - type: dropdown
    id: visibility
    attributes:
      label: "Visibility"
      options: ["internal","private"]
    validations:
      required: false
  - type: input
    id: team_size
    attributes:
      label: "Team size"
      description: "A whole number."
    validations:
      required: false
  - type: checkboxes
    id: archived
    attributes:
      label: "Archived"
      options:
        - label: "Yes"
  - type: textarea
    id: reason
    attributes:
      label: "Reason"
    validations:
      required: false
