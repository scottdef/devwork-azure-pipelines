# Generated by tmplforge new cicd dispatch.
# Inputs reach the shell only as environment variables (INPUT_*), never by
# ${{ }} interpolation into run:, so no input can inject shell syntax.
name: dispatch

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment"
        type: choice
        required: true
        default: "beta"
        options: ["beta","prod"]
      dry_run:
        description: "Dry run"
        type: boolean
        required: false
        default: true
      replicas:
        description: "Replicas"
        type: number
        required: false
        default: 2
      note:
        description: "Note"
        type: string
        required: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ vars.GO_VERSION || '1.24.x' }}
      - name: run tmplforge
        env:
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_REPLICAS: ${{ inputs.replicas }}
          INPUT_NOTE: ${{ inputs.note }}
        run: |
          {
            echo "## dispatch"
            echo
            echo '| input | value |'
            echo '|---|---|'
            printf '| environment | %s |\n' "$INPUT_ENVIRONMENT"
            printf '| dry_run | %s |\n' "$INPUT_DRY_RUN"
            printf '| replicas | %s |\n' "$INPUT_REPLICAS"
            printf '| note | %s |\n' "$INPUT_NOTE"
          } >> "$GITHUB_STEP_SUMMARY"
          go run ./cmd/tmplforge
