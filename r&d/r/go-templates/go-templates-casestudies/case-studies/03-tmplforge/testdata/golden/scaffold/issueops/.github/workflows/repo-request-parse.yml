# Generated by tmplforge new issueops repo-request.
# Parses "Repo request" issues with cmd/repo-request-parse, comments on
# validation errors, and on success sends a repository_dispatch event
# "repo-request" with the parsed fields as client_payload. The dispatch uses
# the issueops-autoadmin-app token: events created with GITHUB_TOKEN do not
# start workflows, an App's token does.
name: repo-request-parse

on:
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write

concurrency:
  group: repo-request-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  parse:
    if: contains(github.event.issue.labels.*.name, 'repo-request')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ vars.GO_VERSION || '1.24.x' }}
      - name: parse issue body
        id: parse
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set +e
          printf '%s' "$ISSUE_BODY" | go run ./cmd/repo-request-parse -dispatch repo-request > dispatch.json 2> errors.md
          echo "status=$?" >> "$GITHUB_OUTPUT"
      - name: report validation errors
        if: steps.parse.outputs.status != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          { echo 'IssueOps could not parse this request:'; echo; cat errors.md; } > comment.md
          gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body-file comment.md
          exit 1
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
      - name: dispatch repo-request
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/dispatches" --input dispatch.json
          gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body "Parsed. Dispatched event repo-request."
