groups:
  - name: tmplforge
    rules:
      - alert: TmplforgeRenderSlow
        expr: histogram_quantile(0.99, sum(rate(tmplforge_render_seconds_bucket[5m])) by (le)) > 0.15
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "p99 render latency above 150ms on {{ $labels.instance }}"
          value: "{{ $value | humanize }}"
      - alert: TmplforgeDown
        expr: up{job="tmplforge"} == 0
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "tmplforge is down on {{ $labels.instance }}"
          value: "{{ $value | humanize }}"
