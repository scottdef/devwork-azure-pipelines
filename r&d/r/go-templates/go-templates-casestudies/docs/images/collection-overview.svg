<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="1100" height="620" fill="#ffffff"/>
  <text x="550" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#111">Go templates as a systems substrate — three case studies, one mechanism</text>

  <!-- substrate -->
  <rect x="40" y="470" width="1020" height="110" rx="10" fill="#f3f3f3" stroke="#555"/>
  <text x="550" y="496" text-anchor="middle" font-weight="bold" fill="#111">Substrate: FuncMap  +  data source  +  destination</text>
  <text x="550" y="520" text-anchor="middle" fill="#333">text/template (trusted authors, raw output) · html/template (contextual escaping) · text/template/parse (lint, variable discovery)</text>
  <text x="550" y="542" text-anchor="middle" fill="#333">19 builtins · no I/O without a FuncMap · parse once, Execute concurrently · maxExecDepth 100 000 · no context ⇒ bound it yourself</text>
  <text x="550" y="564" text-anchor="middle" fill="#333">Go 1.24 language level · stdlib + vendored go-echarts v2.7.3 + vendored htmx 2.0.11 · static binaries for linux, darwin, plan9</text>

  <!-- CS1 -->
  <rect x="40" y="70" width="320" height="370" rx="10" fill="#e8f1fb" stroke="#2b6cb0" stroke-width="2"/>
  <text x="200" y="98" text-anchor="middle" font-weight="bold" fill="#1a365d">CS1 · tmplwatch</text>
  <text x="200" y="118" text-anchor="middle" fill="#1a365d">HashiCorp consul-template pattern, stdlib</text>
  <rect x="70" y="140" width="260" height="36" rx="6" fill="#fff" stroke="#2b6cb0"/>
  <text x="200" y="163" text-anchor="middle">GitHub repo kv/* (ETag polling) or dir</text>
  <rect x="70" y="200" width="260" height="36" rx="6" fill="#fff" stroke="#2b6cb0"/>
  <text x="200" y="223" text-anchor="middle">brain: snapshot + dependency tracking</text>
  <rect x="70" y="260" width="260" height="36" rx="6" fill="#fff" stroke="#2b6cb0"/>
  <text x="200" y="283" text-anchor="middle">render → atomic write → wait/splay → cmd</text>
  <rect x="70" y="320" width="260" height="36" rx="6" fill="#fff" stroke="#2b6cb0"/>
  <text x="200" y="343" text-anchor="middle">Caddyfile · nginx · wg0 · prom · HCL · Corefile</text>
  <rect x="70" y="380" width="260" height="36" rx="6" fill="#fff" stroke="#2b6cb0"/>
  <text x="200" y="403" text-anchor="middle">/metrics rendered by a template · /healthz</text>
  <line x1="200" y1="176" x2="200" y2="200" stroke="#333" marker-end="url(#arr)"/>
  <line x1="200" y1="236" x2="200" y2="260" stroke="#333" marker-end="url(#arr)"/>
  <line x1="200" y1="296" x2="200" y2="320" stroke="#333" marker-end="url(#arr)"/>
  <line x1="200" y1="356" x2="200" y2="380" stroke="#333" marker-end="url(#arr)"/>

  <!-- CS2 -->
  <rect x="390" y="70" width="320" height="370" rx="10" fill="#edf7ed" stroke="#2f855a" stroke-width="2"/>
  <text x="550" y="98" text-anchor="middle" font-weight="bold" fill="#22543d">CS2 · IssueOps library</text>
  <text x="550" y="118" text-anchor="middle" fill="#22543d">Pages in → issue → Pages out · borrow ledger</text>
  <rect x="420" y="140" width="260" height="36" rx="6" fill="#fff" stroke="#2f855a"/>
  <text x="550" y="163" text-anchor="middle">static form (built from issue-form YAML)</text>
  <rect x="420" y="200" width="260" height="36" rx="6" fill="#fff" stroke="#2f855a"/>
  <text x="550" y="223" text-anchor="middle">prefilled issues/new?template=… URL (no secrets)</text>
  <rect x="420" y="260" width="260" height="36" rx="6" fill="#fff" stroke="#2f855a"/>
  <text x="550" y="283" text-anchor="middle">intake.yml: issueparse → validate → dispatch</text>
  <rect x="420" y="320" width="260" height="36" rx="6" fill="#fff" stroke="#2f855a"/>
  <text x="550" y="343" text-anchor="middle">App token → repository_dispatch → publish.yml</text>
  <rect x="420" y="380" width="260" height="36" rx="6" fill="#fff" stroke="#2f855a"/>
  <text x="550" y="403" text-anchor="middle">items/&lt;source&gt;/… + bundle + ledger → Pages</text>
  <line x1="550" y1="176" x2="550" y2="200" stroke="#333" marker-end="url(#arr)"/>
  <line x1="550" y1="236" x2="550" y2="260" stroke="#333" marker-end="url(#arr)"/>
  <line x1="550" y1="296" x2="550" y2="320" stroke="#333" marker-end="url(#arr)"/>
  <line x1="550" y1="356" x2="550" y2="380" stroke="#333" marker-end="url(#arr)"/>

  <!-- CS3 -->
  <rect x="740" y="70" width="320" height="370" rx="10" fill="#fdf2e9" stroke="#c05621" stroke-width="2"/>
  <text x="900" y="98" text-anchor="middle" font-weight="bold" fill="#7b341e">CS3 · tmplforge</text>
  <text x="900" y="118" text-anchor="middle" fill="#7b341e">ed/sam-style TUI + htmx GUI generator</text>
  <rect x="770" y="140" width="260" height="36" rx="6" fill="#fff" stroke="#c05621"/>
  <text x="900" y="163" text-anchor="middle">catalog: workflow · issue-form · mkfile · …</text>
  <rect x="770" y="200" width="260" height="36" rx="6" fill="#fff" stroke="#c05621"/>
  <text x="900" y="223" text-anchor="middle">builder: format → vars → template → preview</text>
  <rect x="770" y="260" width="260" height="36" rx="6" fill="#fff" stroke="#c05621"/>
  <text x="900" y="283" text-anchor="middle">lint + vars via text/template/parse walker</text>
  <rect x="770" y="320" width="260" height="36" rx="6" fill="#fff" stroke="#c05621"/>
  <text x="900" y="343" text-anchor="middle">sandbox: re-exec, 64 KiB/1 MiB/2 s caps</text>
  <rect x="770" y="380" width="260" height="36" rx="6" fill="#fff" stroke="#c05621"/>
  <text x="900" y="403" text-anchor="middle">export · new issueops · new cicd · /chart</text>
  <line x1="900" y1="176" x2="900" y2="200" stroke="#333" marker-end="url(#arr)"/>
  <line x1="900" y1="236" x2="900" y2="260" stroke="#333" marker-end="url(#arr)"/>
  <line x1="900" y1="296" x2="900" y2="320" stroke="#333" marker-end="url(#arr)"/>
  <line x1="900" y1="356" x2="900" y2="380" stroke="#333" marker-end="url(#arr)"/>

  <!-- down arrows to substrate -->
  <line x1="200" y1="440" x2="200" y2="470" stroke="#333" marker-end="url(#arr)"/>
  <line x1="550" y1="440" x2="550" y2="470" stroke="#333" marker-end="url(#arr)"/>
  <line x1="900" y1="440" x2="900" y2="470" stroke="#333" marker-end="url(#arr)"/>
  <text x="550" y="604" text-anchor="middle" font-size="12" fill="#666">docs/images/collection-overview.svg · hand-written SVG, no external fonts or tools</text>
</svg>
