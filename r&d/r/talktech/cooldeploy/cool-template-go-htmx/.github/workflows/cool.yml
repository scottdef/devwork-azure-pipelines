# The whole pipeline lives in CoolEngOrg/cool-actions. This file only calls it.
# It passes no secrets: the job proves who it is with a GitHub OIDC token.
name: cool
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
permissions:
  contents: read
  id-token: write
  pull-requests: write
jobs:
  cool:
    uses: CoolEngOrg/cool-actions/.github/workflows/cool-pipeline.yml@v1
