{{- /*
The namespace of one app in one environment, or of one preview.

Pod security: the Istio sidecar's init container needs NET_ADMIN and NET_RAW
unless the cluster runs Istio CNI, so without CNI the namespace can only
enforce "privileged". It still warns and audits against "restricted", and
the cool-app chart writes restricted-grade security contexts regardless.
*/ -}}
{{- $l := dict "app.kubernetes.io/managed-by" "cooldeploy" "cool/team" .Values.team "cool/app" .Values.app "cool/env" .Values.environment "pod-security.kubernetes.io/enforce" .Values.platform.podSecurity "pod-security.kubernetes.io/warn" "restricted" "pod-security.kubernetes.io/audit" "restricted" -}}
{{- if gt (int .Values.preview) 0 -}}
{{- $_ := set $l "cool/preview" (toString (int .Values.preview)) -}}
{{- end -}}
{{- if .Values.platform.mesh.enabled -}}
{{- $_ := set $l "istio.io/rev" .Values.platform.mesh.revision -}}
{{- end -}}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Release.Namespace }}
  labels: {{ toJson $l }}
{{- if .Values.group }}
---
{{- /* The team reads its own namespace: objects, logs, events. Nothing more. */}}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cool-team-view
  namespace: {{ .Release.Namespace }}
  labels: {"cool/team": {{ .Values.team | quote }}}
roleRef: {"apiGroup": "rbac.authorization.k8s.io", "kind": "ClusterRole", "name": "view"}
subjects:
  - {"apiGroup": "rbac.authorization.k8s.io", "kind": "Group", "name": {{ .Values.group | quote }}}
{{- end }}
