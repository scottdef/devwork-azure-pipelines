{{- /*
Settings of the Azure Monitor metrics add-on (managed Prometheus). The one
line that matters to apps is pod-annotation-based-scraping: with it, any pod
that carries prometheus.io/scrape: "true" is scraped, which is what the
cool-app chart puts on every app pod.

The add-on reads this ConfigMap by name. Microsoft extends its keys from
time to time; compare with the template in Azure/prometheus-collector before
changing more than the regular expression.
*/ -}}
{{- if .Values.platform.metrics.manageSettings }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: ama-metrics-settings-configmap
  namespace: kube-system
data:
  schema-version: v1
  config-version: ver1
  prometheus-collector-settings: |-
    cluster_alias = {{ .Values.platform.metrics.clusterAlias | quote }}
  default-scrape-settings-enabled: |-
    kubelet = true
    coredns = false
    cadvisor = true
    kubeproxy = false
    apiserver = false
    kubestate = true
    nodeexporter = true
    windowsexporter = false
    windowskubeproxy = false
    kappiebasic = true
    prometheuscollectorhealth = false
  pod-annotation-based-scraping: |-
    podannotationnamespaceregex = {{ .Values.platform.metrics.namespaceRegex | quote }}
  default-targets-scrape-interval-settings: |-
    kubelet = "30s"
    cadvisor = "30s"
    kubestate = "30s"
    nodeexporter = "30s"
    podannotations = "30s"
  debug-mode: |-
    enabled = false
{{- end }}
