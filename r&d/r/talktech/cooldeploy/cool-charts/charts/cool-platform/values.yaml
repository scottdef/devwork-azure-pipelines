# Defaults of the cool-platform chart. README.md documents every key.
#
# YAML in JSON syntax, like every values file on the platform.
{
  "platform": {
    "environment": "dev",
    "registry": "registry.invalid",
    "domain": "coolapps.example",
    "extraHosts": [],
    "extraRegistries": ["mcr.microsoft.com/"],
    "mesh": {
      "enabled": true,
      "rootNamespace": "aks-istio-system",
