name: "CoolDeploy: Promote a release"
description: "Copy the release that is live in one environment to the next one."
title: "[cool-deploy-promote] "
labels: ["issueops", "issueops:cool-deploy-promote"]
body:
  - type: markdown
    attributes:
      value: |
        Copy the release that is live in one environment to the next one.

        After opening the issue, comment `.submit` to ask for approval. `.status` shows where the request stands.
  - type: input
    id: app
    attributes:
      label: "App"
      description: "The app, as team/app."
      placeholder: "payments/checkout"
    validations:
      required: true
  - type: dropdown
    id: from
    attributes:
      label: "From"
      description: "The environment the release is live in."
      options:
        - "dev"
        - "tst"
      default: 0
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: "Environment"
      description: "The environment to promote to."
      options:
        - "tst"
        - "prd"
      default: 0
    validations:
      required: true
  - type: input
    id: release
    attributes:
      label: "Release"
      description: "Leave empty for the live release of the source environment, or name one, such as r1a2b3c4."
    validations:
      required: false
