name: "CoolDeploy: Custom domain"
description: "Add or remove a custom host name of a public app."
title: "[cool-domain] "
labels: ["issueops", "issueops:cool-domain"]
body:
  - type: markdown
    attributes:
      value: |
        Add or remove a custom host name of a public app.

        After opening the issue, comment `.submit` to ask for approval. `.status` shows where the request stands.
  - type: input
    id: app
    attributes:
      label: "App"
      description: "The app, as team/app."
      placeholder: "payments/checkout"
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: "Environment"
      description: "The environment the domain belongs to."
      options:
        - "prd"
        - "tst"
        - "dev"
      default: 0
    validations:
      required: true
  - type: dropdown
    id: action
    attributes:
      label: "Action"
      options:
        - "add"
        - "remove"
      default: 0
    validations:
      required: true
  - type: input
    id: domain
    attributes:
      label: "Domain"
      description: "A host name you control, such as pay.coolshop.example."
      placeholder: "pay.coolshop.example"
    validations:
      required: true
