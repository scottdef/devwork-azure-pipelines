# Carries out an approved cool-app-retire request.
#
# The comment router calls this workflow when a request of this type is
# approved. The work is in execute-cool-request.yml and scripts/cool/app-retire.sh.
name: execute-cool-app-retire
on:
  workflow_call:
    inputs:
      issue-number:
        type: number
        required: true
permissions: {}
jobs:
  request:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/execute-cool-request.yml
    with:
      type: app-retire
      issue-number: ${{ inputs.issue-number }}
      repositories: none
      azure: none
    secrets: inherit
