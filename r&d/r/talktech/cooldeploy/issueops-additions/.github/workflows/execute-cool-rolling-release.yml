# Carries out an approved cool-rolling-release request.
#
# The comment router calls this workflow when a request of this type is
# approved. The work is in execute-cool-request.yml and scripts/cool/rolling-release.sh.
name: execute-cool-rolling-release
on:
  workflow_call:
    inputs:
      issue-number:
        type: number
        required: true
permissions: {}
jobs:
  request:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/execute-cool-request.yml
    with:
      type: rolling-release
      issue-number: ${{ inputs.issue-number }}
      repositories: none
      azure: monitor
    secrets: inherit
