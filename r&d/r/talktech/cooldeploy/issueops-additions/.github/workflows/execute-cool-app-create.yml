# Carries out an approved cool-app-create request.
#
# The comment router calls this workflow when a request of this type is
# approved. The work is in execute-cool-request.yml and scripts/cool/app-create.sh.
name: execute-cool-app-create
on:
  workflow_call:
    inputs:
      issue-number:
        type: number
        required: true
permissions: {}
jobs:
  request:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/execute-cool-request.yml
    with:
      type: app-create
      issue-number: ${{ inputs.issue-number }}
      repositories: org
      azure: provision
    secrets: inherit
