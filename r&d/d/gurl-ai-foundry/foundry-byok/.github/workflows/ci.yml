# CI for the foundry-byok tool itself.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local        # build with the pinned Go 1.21, never auto-upgrade
    steps:
      - uses: actions/checkout@v4
      # If your enterprise Actions policy requires SHA pins, pin these two.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21.x"
          cache: false           # no go.sum: the module has zero dependencies

      - name: Lint (gofmt + vet)
        run: make lint

      - name: Test (race detector)
        run: make race

      - name: Build
        run: make build

      - name: Validate example inventory
        run: bin/foundry-byok validate --inventory examples/inventory.json

      # manifest.json records the tool version, so build the checker as "dev",
      # the version the committed examples were generated with.
      - name: Example output is up to date
        run: make check VERSION=dev
