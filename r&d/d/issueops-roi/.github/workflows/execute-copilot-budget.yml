# Execute an approved copilot-budget-request: create or update a Copilot
# AI-credit budget with the GitHub billing budgets REST API.
#
# Called by the command router after approval, or dispatched manually
# (for example to re-run after an infrastructure error). The gate job always
# re-verifies the approval for the current request content first.
name: IssueOps · execute Copilot budget

on:
  workflow_call:
    inputs:
      issue:
        type: number
        required: true
  workflow_dispatch:
    inputs:
      issue:
        description: IssueOps issue number
        type: number
        required: true
      force:
        description: Re-run even if a previous run is marked executing (check that run first)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  gate:
    name: Gate
    runs-on: ${{ fromJSON(vars.ISSUEOPS_RUNS_ON || '["ubuntu-latest"]') }}
    timeout-minutes: 10
    concurrency:
      group: issueops-execute-${{ inputs.issue }}
      cancel-in-progress: false
    outputs:
      digest: ${{ steps.gate.outputs.digest }}
      environment: ${{ steps.gate.outputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: setup
        uses: ./.github/actions/setup-issueops
        with:
          client-id: ${{ vars.ISSUEOPS_APP_CLIENT_ID }}
          private-key: ${{ secrets.ISSUEOPS_APP_PRIVATE_KEY }}
          repositories: '*' # validation reads the target repositories
          permission-issues: write
          permission-contents: read
          permission-members: read
          permission-organization-custom-org-roles: read
          permission-organization-administration: read
      - id: gate
        uses: ./.github/actions/gate
        with:
          token: ${{ steps.setup.outputs.token }}
          bot-login: ${{ steps.setup.outputs.bot-login }}
          issue-number: ${{ inputs.issue }}
          request-type: copilot-budget-request
          force: ${{ inputs.force || false }}

  apply:
    name: Apply budget
    needs: gate
    runs-on: ${{ fromJSON(vars.ISSUEOPS_RUNS_ON || '["ubuntu-latest"]') }}
    timeout-minutes: 10
    # copilot-budgets | copilot-budgets-high | copilot-budgets-enterprise.
    # Configure required reviewers (e.g. FinOps) on the -high environment.
    environment: ${{ needs.gate.outputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: setup
        uses: ./.github/actions/setup-issueops
        with:
          client-id: ${{ vars.ISSUEOPS_APP_CLIENT_ID }}
          private-key: ${{ secrets.ISSUEOPS_APP_PRIVATE_KEY }}
          repositories: '*' # validation reads the target repositories
          permission-issues: read
          permission-contents: read
          permission-members: read
          permission-organization-custom-org-roles: read
          permission-organization-administration: write # budgets API
      - name: Plan
        env:
          GH_TOKEN: ${{ steps.setup.outputs.token }}
          ISSUE: ${{ inputs.issue }}
          DIGEST: ${{ needs.gate.outputs.digest }}
        run: |
          issueops budget plan --issue "$ISSUE" --expect-digest "$DIGEST"
          jq . "$RUNNER_TEMP/issueops/plan.json"
      - name: Apply
        env:
          GH_TOKEN: ${{ steps.setup.outputs.token }}
          # Only the copilot-budgets-enterprise environment defines this secret
          # (classic PAT of an enterprise billing manager, for cost-center budgets).
          GH_ENTERPRISE_TOKEN: ${{ secrets.ENTERPRISE_BILLING_PAT }}
          ISSUE: ${{ inputs.issue }}
          DIGEST: ${{ needs.gate.outputs.digest }}
        run: issueops budget apply --issue "$ISSUE" --expect-digest "$DIGEST"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: outcome-${{ inputs.issue }}
          path: ${{ runner.temp }}/issueops/outcome.json
          retention-days: 30
          if-no-files-found: ignore

  report:
    name: Report
    needs: [gate, apply]
    if: always() && needs.gate.result == 'success'
    runs-on: ${{ fromJSON(vars.ISSUEOPS_RUNS_ON || '["ubuntu-latest"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: setup
        uses: ./.github/actions/setup-issueops
        with:
          client-id: ${{ vars.ISSUEOPS_APP_CLIENT_ID }}
          private-key: ${{ secrets.ISSUEOPS_APP_PRIVATE_KEY }}
          repositories: '*' # validation reads the target repositories
          permission-issues: write
          permission-contents: read
          permission-members: read
          permission-organization-administration: read
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: outcome-${{ inputs.issue }}
          path: ${{ runner.temp }}/outcome
      - uses: ./.github/actions/finish
        with:
          token: ${{ steps.setup.outputs.token }}
          bot-login: ${{ steps.setup.outputs.bot-login }}
          issue-number: ${{ inputs.issue }}
          status: ${{ needs.apply.result == 'success' && 'completed' || 'failed' }}
          result: ${{ runner.temp }}/outcome/outcome.json
          error: ${{ needs.apply.result != 'success' && format('The {0} job ended with result "{1}".', 'apply', needs.apply.result) || '' }}
