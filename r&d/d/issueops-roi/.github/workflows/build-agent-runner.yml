# Builds the agent-runner image (Go 1.21, distroless, non-root) and pushes it
# to Azure Container Registry with OIDC. Update the image reference (preferably
# by digest) in config/issueops.json -> agentic-task-request.settings.backends
# .aks-foundry-agent.image through a pull request.
name: IssueOps · build agent runner

on:
  push:
    branches: [main]
    paths:
      - cmd/agent-runner/**
      - internal/** # the runner imports agent, qa, tmpl, ghapi, config, issueform, request
      - deploy/agent-runner/**
      - go.mod
      - go.sum
  workflow_dispatch:
    inputs:
      version:
        description: Image tag (semver), e.g. 1.0.1
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ fromJSON(vars.ISSUEOPS_RUNS_ON || '["ubuntu-latest"]') }}
    timeout-minutes: 30
    environment: acr-push # AZURE_CLIENT_ID with AcrPush on the registry only
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: ACR login
        env:
          ACR: ${{ vars.ACR_NAME }}
        run: az acr login -n "$ACR"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Tags
        id: tags
        env:
          ACR: ${{ vars.ACR_NAME }}
          VERSION: ${{ inputs.version }}
        run: |
          repo="${ACR}.azurecr.io/issueops/agent-runner"
          tags="${repo}:sha-${GITHUB_SHA::12}"
          [ -n "$VERSION" ] && tags="${tags},${repo}:${VERSION}"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION:-sha-${GITHUB_SHA::12}}" >> "$GITHUB_OUTPUT"
      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/agent-runner/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: VERSION=${{ steps.tags.outputs.version }}
          provenance: mode=max
          sbom: true
      - name: Summary
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          {
            echo "### agent-runner image"
            echo ""
            echo "Tags: \`$TAGS\`"
            echo ""
            echo "Digest: \`$DIGEST\` — reference the image by digest in config/issueops.json."
          } >> "$GITHUB_STEP_SUMMARY"
