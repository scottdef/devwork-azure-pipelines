# Execute an approved copilot-usage-report: download Copilot usage-metrics
# NDJSON reports, join them with merged pull requests, reviews and AI-credit
# cost, render the go-echarts HTML report / CSV / JSON, upload the bundle as a
# workflow artifact and (optionally) push Prometheus metrics for Grafana.
name: IssueOps · execute Copilot report

on:
  workflow_call:
    inputs:
      issue:
        type: number
        required: true
  workflow_dispatch:
    inputs:
      issue:
        description: IssueOps issue number
        type: number
        required: true
      force:
        description: Re-run even if a previous run is marked executing
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  gate:
    name: Gate
    runs-on: ${{ fromJSON(vars.ISSUEOPS_RUNS_ON || '["ubuntu-latest"]') }}
    timeout-minutes: 10
    concurrency:
      group: issueops-execute-${{ inputs.issue }}
      cancel-in-progress: false
    outputs:
      digest: ${{ steps.gate.outputs.digest }}
      environment: ${{ steps.gate.outputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: setup
        uses: ./.github/actions/setup-issueops
        with:
          client-id: ${{ vars.ISSUEOPS_APP_CLIENT_ID }}
          private-key: ${{ secrets.ISSUEOPS_APP_PRIVATE_KEY }}
          repositories: '*' # validation reads the target repositories
          permission-issues: write
          permission-contents: read
          permission-members: read
          permission-organization-custom-org-roles: read
      - id: gate
        uses: ./.github/actions/gate
        with:
          token: ${{ steps.setup.outputs.token }}
          bot-login: ${{ steps.setup.outputs.bot-login }}
          issue-number: ${{ inputs.issue }}
          request-type: copilot-usage-report
          force: ${{ inputs.force || false }}

  build:
    name: Build report
    needs: gate
    # Needs network access to the Pushgateway when Grafana publishing is requested:
    # runs on the self-hosted runner in the AKS virtual network when configured.
    runs-on: ${{ fromJSON(vars.ISSUEOPS_AKS_RUNS_ON || vars.ISSUEOPS_RUNS_ON || '["ubuntu-latest"]') }}
    timeout-minutes: 60
    environment: ${{ needs.gate.outputs.environment }}
    outputs:
      artifact_url: ${{ steps.upload.outputs.artifact-url }}
      grafana: ${{ steps.build.outputs.grafana }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: setup
        uses: ./.github/actions/setup-issueops
        with:
          client-id: ${{ vars.ISSUEOPS_APP_CLIENT_ID }}
          private-key: ${{ secrets.ISSUEOPS_APP_PRIVATE_KEY }}
          # Inherit the app's permissions: Copilot metrics (org), members (org),
          # contents/metadata/pull requests (search, statistics) on all repos.
          narrow: 'false'
          repositories: '*'
      - name: Build report
        id: build
        env:
          GH_TOKEN: ${{ steps.setup.outputs.token }}
          ISSUE: ${{ inputs.issue }}
          DIGEST: ${{ needs.gate.outputs.digest }}
        run: issueops report build --issue "$ISSUE" --expect-digest "$DIGEST"
      - name: Upload report bundle
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: copilot-report-${{ inputs.issue }}
          path: ${{ steps.build.outputs.report_dir }}
          retention-days: 30
      - name: Push metrics to Grafana (Pushgateway)
        if: steps.build.outputs.grafana == 'true'
        env:
          PUSHGATEWAY_URL: ${{ vars.PUSHGATEWAY_URL }}
          PUSHGATEWAY_AUTH: ${{ secrets.PUSHGATEWAY_AUTH }}
          PROM: ${{ steps.build.outputs.prom }}
          ISSUE: ${{ inputs.issue }}
        run: issueops report push --file "$PROM" --grouping "org=${GITHUB_REPOSITORY_OWNER},request=${ISSUE}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: outcome-${{ inputs.issue }}
          path: ${{ runner.temp }}/issueops/outcome.json
          retention-days: 30

  report:
    name: Report
    needs: [gate, build]
    if: always() && needs.gate.result == 'success'
    runs-on: ${{ fromJSON(vars.ISSUEOPS_RUNS_ON || '["ubuntu-latest"]') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: setup
        uses: ./.github/actions/setup-issueops
        with:
          client-id: ${{ vars.ISSUEOPS_APP_CLIENT_ID }}
          private-key: ${{ secrets.ISSUEOPS_APP_PRIVATE_KEY }}
          repositories: '*' # validation reads the target repositories
          permission-issues: write
          permission-contents: read
          permission-members: read
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: outcome-${{ inputs.issue }}
          path: ${{ runner.temp }}/outcome
      - uses: ./.github/actions/finish
        with:
          token: ${{ steps.setup.outputs.token }}
          bot-login: ${{ steps.setup.outputs.bot-login }}
          issue-number: ${{ inputs.issue }}
          status: ${{ needs.build.result == 'success' && 'completed' || 'failed' }}
          result: ${{ runner.temp }}/outcome/outcome.json
          error: ${{ needs.build.result != 'success' && format('The build job ended with result "{0}".', needs.build.result) || '' }}
          extra: |
            artifact_url=${{ needs.build.outputs.artifact_url }}
            grafana=${{ needs.build.outputs.grafana }}
