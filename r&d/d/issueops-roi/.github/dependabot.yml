version: 2
updates:
  # Keeps the SHA-pinned actions current (Dependabot updates the version comments too).
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /deploy/agent-runner
    schedule:
      interval: weekly
