# Caps concurrent agent runs and their footprint in the namespace.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: issueops-agents
  namespace: issueops-agents
  labels:
    app.kubernetes.io/part-of: issueops
spec:
  hard:
    count/jobs.batch: "20"
    pods: "10"
    requests.cpu: "2"
    requests.memory: 2Gi
    limits.cpu: "5"
    limits.memory: 4Gi
    configmaps: "40"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: issueops-agents
  namespace: issueops-agents
  labels:
    app.kubernetes.io/part-of: issueops
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 256Mi
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      max:
        cpu: "1"
        memory: 512Mi
