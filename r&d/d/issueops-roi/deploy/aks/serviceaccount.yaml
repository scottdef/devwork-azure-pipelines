# Workload identity for the agent runner. The client ID is the user-assigned
# managed identity created by deploy/azure/setup-oidc.sh (id-issueops-agent-runner),
# which has "Cognitive Services OpenAI User" on the approved Foundry account and
# a federated credential for system:serviceaccount:issueops-agents:issueops-agent-runner.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: issueops-agent-runner
  namespace: issueops-agents
  labels:
    app.kubernetes.io/part-of: issueops
    azure.workload.identity/use: "true"
  annotations:
    azure.workload.identity/client-id: "00000000-0000-0000-0000-000000000000" # REPLACE: managed identity client ID
automountServiceAccountToken: false
