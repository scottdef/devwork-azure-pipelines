# Agent pods accept no inbound traffic and may only resolve DNS and speak HTTPS.
# Kubernetes NetworkPolicy cannot filter by FQDN: restrict HTTPS egress further
# to the Foundry endpoint and login.microsoftonline.com with Azure Firewall /
# the AKS egress gateway, or a Cilium FQDN policy (Azure CNI powered by Cilium
# with Advanced Container Networking Services).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-runner-egress
  namespace: issueops-agents
  labels:
    app.kubernetes.io/part-of: issueops
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: issueops-agent-runner
  policyTypes: ["Ingress", "Egress"]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: 443
