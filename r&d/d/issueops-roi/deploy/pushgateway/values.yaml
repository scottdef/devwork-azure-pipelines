# prometheus-community/prometheus-pushgateway (tested with chart 3.9.0).
#   helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
#   helm upgrade --install pushgateway prometheus-community/prometheus-pushgateway \
#     -n monitoring --create-namespace -f deploy/pushgateway/values.yaml --version 3.9.0
#
# IssueOps pushes two groups: job=issueops_copilot_roi (one group per report
# request: org, request labels) and job=issueops_ops (hourly platform metrics).
# Prometheus must scrape with honor_labels: true so the pushed job/org/request
# labels are kept.
persistentVolume:
  enabled: true
  size: 2Gi
  storageClass: managed-csi
extraArgs:
  - --persistence.interval=5m
serviceMonitor:
  enabled: true          # kube-prometheus-stack / Prometheus Operator
  honorLabels: true
  interval: 60s
  additionalLabels:
    release: kube-prometheus-stack
resources:
  requests: { cpu: 20m, memory: 32Mi }
  limits: { cpu: 200m, memory: 128Mi }
securityContext:
  runAsNonRoot: true
  runAsUser: 65534
  fsGroup: 65534
# Exposed to self-hosted GitHub runners in the VNet through an internal ingress
# with basic auth (PUSHGATEWAY_AUTH=user:password secret in GitHub). Never
# expose the Pushgateway publicly: it accepts writes without authentication.
ingress:
  enabled: true
  className: nginx-internal
  hosts:
    - pushgateway.internal.cooleng.example
  annotations:
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: pushgateway-basic-auth
    nginx.ingress.kubernetes.io/auth-realm: IssueOps Pushgateway
