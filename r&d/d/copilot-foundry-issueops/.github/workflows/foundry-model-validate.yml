# foundry-model-validate.yml — reusable. Proves chat + streaming + tool calling.
# Keyless: uses the OIDC identity (needs "Cognitive Services User" on the account).
name: Foundry model — validate

on:
  workflow_call:
    inputs:
      environment:  { required: true,  type: string }
      endpoint:     { required: true,  type: string }
      deployment:   { required: true,  type: string }
      expect_tools: { required: false, type: boolean, default: true }
    outputs:
      url_shape:
        value: ${{ jobs.validate.outputs.url_shape }}
      tool_calling:
        value: ${{ jobs.validate.outputs.tool_calling }}
      base_url:
        value: ${{ jobs.validate.outputs.base_url }}
  workflow_dispatch:
    inputs:
      environment:  { required: true, type: string, default: foundry-dev }
      endpoint:     { required: true, type: string }
      deployment:   { required: true, type: string }
      expect_tools: { required: false, type: boolean, default: true }

permissions:
  id-token: write
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    outputs:
      url_shape:    ${{ steps.v.outputs.url_shape }}
      tool_calling: ${{ steps.v.outputs.tool_calling }}
      base_url:     ${{ steps.v.outputs.base_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id:       ${{ vars.AZURE_CLIENT_ID }}
          tenant-id:       ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - id: v
        env:
          ENDPOINT:     ${{ inputs.endpoint }}
          DEPLOYMENT:   ${{ inputs.deployment }}
          EXPECT_TOOLS: ${{ inputs.expect_tools }}
        run: scripts/validate-endpoint.sh
