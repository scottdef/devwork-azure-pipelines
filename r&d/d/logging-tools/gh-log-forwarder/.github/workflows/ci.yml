name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Preflight, lint, test, build
        run: make ci
      - name: Cross-compile every release target
        run: make release checksums verify VERSION="ci-${GITHUB_SHA::12}"
      - name: Coverage
        run: make cover

  shell-and-workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: shellcheck (preinstalled on ubuntu runners)
        run: shellcheck -x -S warning scripts/*.sh
      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color .github/workflows/*.yml templates/notify-forwarder.yml

  terraform:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"
      - run: terraform -chdir=terraform fmt -check -recursive
      - run: terraform -chdir=terraform init -backend=false -input=false
      - run: terraform -chdir=terraform validate
