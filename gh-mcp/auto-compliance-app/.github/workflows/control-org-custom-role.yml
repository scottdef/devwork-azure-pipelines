name: Control - Custom Roles

on:
  schedule:
    - cron: '15 */6 * * *'  # Every 6 hours at minute 15
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-custom-roles:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup GitHub CLI
        run: |
          type -p gh >/dev/null || sudo apt-get install gh -y
          gh --version

      - name: Authenticate
        run: echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

      - name: Check custom roles
        id: check
        run: |
          set -e
          echo "🔍 Checking organization custom roles..."
          ORG="${{ github.repository_owner }}"
          
          errors=0
          warnings=0
          
          # Get custom roles (Enterprise Cloud feature)
          echo "Fetching custom roles..."
          custom_roles=$(gh api "/orgs/${ORG}/organization-roles" 2>/dev/null || echo '{"roles":[]}')
          
          role_count=$(echo "$custom_roles" | jq '.roles | length')
          
          if [ "$role_count" -eq 0 ]; then
            echo "::notice::No custom roles defined (using default roles)"
            # This is not necessarily an error for smaller orgs
          else
            echo "✅ Found $role_count custom roles"
            
            # Check for recommended roles
            recommended_roles=("security-engineer" "release-manager" "code-reviewer")
            
            for rec_role in "${recommended_roles[@]}"; do
              has_role=$(echo "$custom_roles" | jq -r ".roles[] | select(.name | test(\"$rec_role\"; \"i\")) | .name" | head -n1)
              
              if [ -z "$has_role" ]; then
                echo "  ℹ️  Recommended role not found: $rec_role"
              else
                echo "  ✅ Found recommended role: $has_role"
              fi
            done
            
            # Check for overly permissive roles
            echo ""
            echo "Checking role permissions..."
            
            admin_roles=$(echo "$custom_roles" | jq -r '.roles[] | select(.permissions[] | contains("admin")) | .name')
            
            if [ -n "$admin_roles" ]; then
              echo "::warning::Found custom roles with admin permissions:"
              echo "$admin_roles" | while read role; do
                echo "  ⚠️  $role"
              done
              ((warnings++))
            else
              echo "✅ No custom roles have admin permissions"
            fi
          fi
          
          # Check team role assignments
          echo ""
          echo "Checking team assignments..."
          teams=$(gh api "/orgs/${ORG}/teams?per_page=10" --jq '.[].slug' 2>/dev/null || echo "")
          
          team_count=$(echo "$teams" | grep -c . || echo 0)
          echo "Found $team_count teams"
          
          if [ $team_count -gt 0 ]; then
            echo "✅ Teams are configured"
          else
            echo "::notice::No teams found in organization"
          fi
          
          echo ""
          echo "📊 Custom Role Summary:"
          echo "  Total custom roles: $role_count"
          echo "  Warnings: $warnings"
          echo "  Errors: $errors"
          
          echo "errors=$errors" >> $GITHUB_OUTPUT
          
          if [ $errors -gt 0 ]; then
            echo "::error::Found $errors custom role configuration issues"
            exit 1
          fi
          
          if [ $warnings -gt 0 ]; then
            echo "::warning::Found $warnings role permission warnings"
          fi
          
          echo "✅ Custom role checks passed"

      - name: Report status
        if: always()
        run: |
          if [ "${{ steps.check.outcome }}" = "success" ]; then
            echo "✅ Control passed: Custom roles are properly configured"
          else
            echo "❌ Control failed: Custom roles need attention"
          fi
