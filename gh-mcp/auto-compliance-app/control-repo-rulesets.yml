name: Control - Repository Rulesets

on:
  schedule:
    - cron: '10 */6 * * *'  # Every 6 hours at minute 10
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-rulesets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup GitHub CLI
        run: |
          type -p gh >/dev/null || sudo apt-get install gh -y
          gh --version

      - name: Authenticate
        run: echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

      - name: Check repository rulesets
        id: check
        run: |
          set -e
          echo "🔍 Checking repository rulesets and branch protection..."
          ORG="${{ github.repository_owner }}"
          
          errors=0
          warnings=0
          
          # Check organization-level rulesets
          echo "Checking organization-level rulesets..."
          org_rulesets=$(gh api "/orgs/${ORG}/rulesets" --jq '.[] | select(.enforcement == "active")' 2>/dev/null || echo "[]")
          
          active_rulesets=$(echo "$org_rulesets" | jq -s 'length')
          
          if [ "$active_rulesets" -eq 0 ]; then
            echo "::warning::No active organization-level rulesets found"
            ((warnings++))
          else
            echo "✅ Found $active_rulesets active organization-level rulesets"
          fi
          
          # Get critical repositories (this repo and any with 'infrastructure', 'terraform', 'config' in name)
          echo "Checking critical repository protections..."
          critical_repos=$(gh api "/orgs/${ORG}/repos?per_page=100" --paginate \
            --jq '.[] | select(.name | test("^(infrastructure|terraform|config|.*-prod)"; "i")) | .name' \
            2>/dev/null || echo "")
          
          # Add current repo to critical list
          current_repo="${{ github.repository }}"
          current_repo_name="${current_repo##*/}"
          
          # Check branch protection on critical repos
          protected_count=0
          unprotected_count=0
          
          for repo in $current_repo_name $critical_repos; do
            echo "  Checking: $repo"
            
            # Check if main/master branch has protection
            protection=$(gh api "/repos/${ORG}/${repo}/branches/main/protection" 2>/dev/null || \
                        gh api "/repos/${ORG}/${repo}/branches/master/protection" 2>/dev/null || \
                        echo "{}")
            
            if [ "$protection" != "{}" ]; then
              # Check for required reviews
              required_reviews=$(echo "$protection" | jq -r '.required_pull_request_reviews.required_approving_review_count // 0')
              
              if [ "$required_reviews" -gt 0 ]; then
                echo "    ✅ Protected with $required_reviews required reviews"
                ((protected_count++))
              else
                echo "    ⚠️  Protected but no required reviews"
                ((warnings++))
              fi
            else
              echo "    ❌ No branch protection found"
              ((unprotected_count++))
              ((errors++))
            fi
          done
          
          echo ""
          echo "📊 Protection Summary:"
          echo "  Protected: $protected_count"
          echo "  Unprotected: $unprotected_count"
          echo "  Warnings: $warnings"
          
          echo "errors=$errors" >> $GITHUB_OUTPUT
          
          if [ $errors -gt 0 ]; then
            echo "::error::Found $errors critical repositories without branch protection"
            exit 1
          fi
          
          if [ $warnings -gt 0 ]; then
            echo "::warning::Found $warnings configuration warnings"
          fi
          
          echo "✅ Repository rulesets and branch protection checks passed"

      - name: Report status
        if: always()
        run: |
          if [ "${{ steps.check.outcome }}" = "success" ]; then
            echo "✅ Control passed: Rulesets and branch protection are compliant"
          else
            echo "❌ Control failed: Rulesets need attention"
          fi
