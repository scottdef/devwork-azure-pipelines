<p>GitHub logs are queryable in Dynatrace via DQL for audit, debugging, and
compliance. Example query and result:</p>
<pre><code>fetch logs
| filter log.source == "github-audit"
| summarize count(), by:{action}
| sort count() desc</code></pre>
