name: Update Trust Center

on:
  schedule:
    # Run every hour at minute 0
    - cron: '0 * * * *'
  workflow_dispatch: # Allow manual trigger
  push:
    branches:
      - main
    paths:
      - '.github/workflows/update-trust-center.yml'
      - 'scripts/generate-trust-center.sh'
      - 'trust-center/**'

permissions:
  contents: write
  actions: read

jobs:
  update-trust-center:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Git config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
      
      - name: Setup GitHub CLI
        run: |
          type -p gh >/dev/null || {
            (type -p wget >/dev/null || (sudo apt update && sudo apt-get install wget -y)) \
            && sudo mkdir -p -m 755 /etc/apt/keyrings \
            && wget -qO- https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo tee /etc/apt/keyrings/githubcli-archive-keyring.gpg > /dev/null \
            && sudo chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg \
            && echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null \
            && sudo apt update \
            && sudo apt install gh -y
          }
          gh --version
      
      - name: Authenticate GitHub CLI
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token
          gh auth status
      
      - name: Generate trust center status
        run: |
          chmod +x scripts/generate-trust-center.sh
          ./scripts/generate-trust-center.sh
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet trust-center/status.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes detected in status.json"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Changes detected in status.json"
          fi
      
      - name: Create or update gh-pages branch
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          # Check if gh-pages branch exists
          if git ls-remote --heads origin gh-pages | grep -q gh-pages; then
            echo "gh-pages branch exists, checking out..."
            git fetch origin gh-pages
            git checkout gh-pages
            git pull origin gh-pages
          else
            echo "Creating new gh-pages branch..."
            git checkout --orphan gh-pages
            git rm -rf .
          fi
          
          # Copy trust-center files
          git checkout main -- trust-center/
          mv trust-center/* .
          rm -rf trust-center
          
          # Add all files
          git add -A
          
          # Commit if there are changes
          if ! git diff --cached --quiet; then
            git commit -m "Update trust center status - $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            git push origin gh-pages
            echo "✅ Trust center updated and pushed to gh-pages"
          else
            echo "ℹ️  No changes to commit"
          fi
      
      - name: Enable GitHub Pages
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          echo "GitHub Pages should be configured to serve from gh-pages branch"
          echo "Visit: https://github.com/${{ github.repository }}/settings/pages"
      
      - name: Display status summary
        run: |
          echo "### Trust Center Update Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Repository:** ${{ github.repository }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** gh-pages" >> $GITHUB_STEP_SUMMARY
          echo "**Updated:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f "trust-center/status.json" ]; then
            echo "**Status:**" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat trust-center/status.json | jq '.' >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
