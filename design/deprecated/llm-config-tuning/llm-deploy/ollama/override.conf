# ──────────────────────────────────────────────────────────────────────
#  /etc/systemd/system/ollama.service.d/override.conf
#
#  Install:
#    sudo cp ollama/override.conf \
#         /etc/systemd/system/ollama.service.d/override.conf
#    sudo systemctl daemon-reload && sudo systemctl restart ollama
#
#  Hardware: Quadro P1000 (4 GB GDDR5, Pascal CC 6.1)
#            i9-10900 (10C/20T), 32 GB DDR4-2933
# ──────────────────────────────────────────────────────────────────────
[Service]

# ── Network ──────────────────────────────────────────────────────────
# Bind to all interfaces so Docker containers and LAN agents can reach
# Ollama.  Firewall (ufw deny 11434) blocks WAN; Tailscale for remote.
Environment="OLLAMA_HOST=0.0.0.0:11434"

# ── Model storage ────────────────────────────────────────────────────
Environment="OLLAMA_MODELS=/usr/share/ollama/.ollama/models"

# ── VRAM management — THE critical section for 4 GB ──────────────────
#
# OLLAMA_GPU_OVERHEAD (bytes)
#   Reserves VRAM Ollama will NOT touch.  512 MB keeps X11/Wayland alive.
#   Set to 0 on a headless box to reclaim it for models.
Environment="OLLAMA_GPU_OVERHEAD=536870912"
#
# OLLAMA_FLASH_ATTENTION
#   Enables Flash Attention kernels.  Required to activate KV-cache
#   quantization below.  Free ~20% prompt-processing speedup on Pascal.
Environment="OLLAMA_FLASH_ATTENTION=1"
#
# OLLAMA_KV_CACHE_TYPE
#   Quantize the KV cache from FP16 to Q8_0.  Roughly halves KV-cache
#   memory at negligible quality loss.  Also supports q4_0 (quarter size,
#   slight quality risk on long contexts).
#   Requires OLLAMA_FLASH_ATTENTION=1.
Environment="OLLAMA_KV_CACHE_TYPE=q8_0"

# ── Scheduling ───────────────────────────────────────────────────────
#
# OLLAMA_NUM_PARALLEL
#   Number of concurrent request slots.  Each slot allocates its own
#   KV cache, so on 4 GB VRAM:
#     1 slot  → 1 × KV   → safe for 3B models
#     2 slots → 2 × KV   → overflows on anything above 1.5B
#   Keep at 1 unless you have ≥12 GB VRAM.
Environment="OLLAMA_NUM_PARALLEL=1"
#
# OLLAMA_MAX_LOADED_MODELS
#   How many models stay resident in memory simultaneously.
#   On 4 GB: 2 works only if one is the 270 MB nomic-embed-text.
#   On 8 GB: 2 chat models or 1 chat + embed + vision.
#   On 12+ GB: 3–4 depending on model sizes.
Environment="OLLAMA_MAX_LOADED_MODELS=2"

# ── Model defaults ───────────────────────────────────────────────────
#
# OLLAMA_KEEP_ALIVE
#   Duration to keep a model loaded after last request.
#   "15m" balances latency vs. VRAM sharing with other models.
#   "-1" = permanent (never unload).  "0" = unload immediately.
Environment="OLLAMA_KEEP_ALIVE=15m"
#
# OLLAMA_CONTEXT_LENGTH
#   Global default num_ctx.  Per-model Modelfile PARAMETER overrides this.
#   4096 is the safe ceiling for 3B+ models on 4 GB with q8_0 KV cache.
#   Increasing to 8192 is viable for ≤1.5B models or on 8+ GB VRAM.
Environment="OLLAMA_CONTEXT_LENGTH=4096"

# ── CORS / API access ───────────────────────────────────────────────
# Allow any origin (Open WebUI, LM Studio, browser agents, curl).
# Restrict to specific origins in production behind a reverse proxy.
Environment="OLLAMA_ORIGINS=*"

# ── Multi-GPU (uncomment if you add a second card) ──────────────────
# Pin Ollama to specific GPU(s) by UUID (from nvidia-smi -L).
# Leave unset to auto-use all CUDA devices.
# Environment="CUDA_VISIBLE_DEVICES=GPU-xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"

# ── Debug ────────────────────────────────────────────────────────────
# Environment="OLLAMA_DEBUG=1"
# Environment="OLLAMA_LLM_LIBRARY=cuda_v12"
