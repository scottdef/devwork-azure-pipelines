[project]
name = "llm-deploy"
version = "1.0.0"
description = "Local LLM deployment configs for P340 SFF (Quadro P1000 4GB)"
requires-python = ">=3.11,<3.13"

dependencies = [
    # ── Ollama SDK ──
    "ollama>=0.4.0",

    # ── LangChain / LangGraph ──
    "langchain>=0.3.0",
    "langchain-ollama>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "langgraph>=0.4.0",

    # ── LlamaIndex ──
    "llama-index>=0.12.0",
    "llama-index-llms-ollama>=0.5.0",
    "llama-index-embeddings-ollama>=0.5.0",

    # ── CrewAI ──
    "crewai>=0.100.0",
    "crewai[tools]",

    # ── AutoGen 0.4+ ──
    "autogen-agentchat>=0.4.0",
    "autogen-ext[ollama]>=0.4.0",

    # ── smolagents ──
    "smolagents>=1.0.0",

    # ── PydanticAI ──
    "pydantic-ai>=0.1.0",

    # ── LiteLLM (used by CrewAI + smolagents + proxy) ──
    "litellm>=1.60.0",

    # ── MCP ──
    "langchain-mcp-adapters>=0.1.0",

    # ── Web / HTTP ──
    "httpx>=0.27.0",
    "trafilatura>=1.12.0",

    # ── Utilities ──
    "pydantic>=2.0",
    "rich>=13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# Pin Python for reproducibility
python = "3.11"

[tool.ruff]
target-version = "py311"
line-length = 100
