# ─────────────────────────────────────────────────────────────────────────────
# dynatrace-workflow-submitter — AKS Kubernetes Manifests
#
# Manifests (apply in order):
#   1. Namespace
#   2. Secret  (DT credentials — populate before applying)
#   3. ConfigMap (workflow JSON)
#   4. Job  (runs the Go submitter once)
#   5. (Optional) CronJob wrapper for recurring provisioning
# ─────────────────────────────────────────────────────────────────────────────

---
apiVersion: v1
kind: Namespace
metadata:
  name: dynatrace-ops
  labels:
    app.kubernetes.io/managed-by: kubectl
    environment: production

---
# ─── Credentials Secret ───────────────────────────────────────────────────────
# Populate DT_TENANT_URL and DT_API_TOKEN before applying.
# Example (base64 encode first):
#   echo -n 'https://abc12345.live.dynatrace.com' | base64
#   echo -n 'dt0c01.XXXXX.YYYYY'                 | base64
apiVersion: v1
kind: Secret
metadata:
  name: dynatrace-credentials
  namespace: dynatrace-ops
  labels:
    app.kubernetes.io/name: dynatrace-workflow-submitter
type: Opaque
data:
  DT_TENANT_URL: REPLACE_WITH_BASE64_ENCODED_TENANT_URL
  DT_API_TOKEN:  REPLACE_WITH_BASE64_ENCODED_API_TOKEN

---
# ─── Workflow Definition ConfigMap ────────────────────────────────────────────
# The workflow JSON is mounted into the container so the binary can read it
# without baking it into the image.  Update the JSON value to match the
# current workflow definition from dynatrace-workflow-create-browser-monitor.json.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dynatrace-workflow-definition
  namespace: dynatrace-ops
  labels:
    app.kubernetes.io/name: dynatrace-workflow-submitter
data:
  workflow.json: |
    {
      "title": "Create Synthetic Browser Monitor",
      "description": "Workflow that provisions a Dynatrace synthetic browser monitor via the Synthetic Monitors API (v1).",
      "owner": "admin",
      "ownerType": "USER",
      "isPrivate": false,
      "trigger": {
        "triggerType": "Manual",
        "filterParameters": { "timerFilterParameters": {} },
        "isActive": true
      },
      "schemaVersion": 3,
      "tasks": {}
    }

---
# ─── ServiceAccount ───────────────────────────────────────────────────────────
# Minimal identity for the submitter Job; no cluster-level RBAC needed.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dynatrace-workflow-submitter
  namespace: dynatrace-ops
  labels:
    app.kubernetes.io/name: dynatrace-workflow-submitter
automountServiceAccountToken: false

---
# ─── One-shot Job ─────────────────────────────────────────────────────────────
# Builds and runs the Go submitter inline using the official Go 1.21 image.
# In a production pipeline replace this with a pre-built image pushed to ACR.
apiVersion: batch/v1
kind: Job
metadata:
  name: dynatrace-workflow-submitter
  namespace: dynatrace-ops
  labels:
    app.kubernetes.io/name: dynatrace-workflow-submitter
    app.kubernetes.io/version: "1.0.0"
spec:
  # Retry up to 2 times on transient failures
  backoffLimit: 2
  # Clean up completed pods after 1 hour
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dynatrace-workflow-submitter
    spec:
      serviceAccountName: dynatrace-workflow-submitter
      restartPolicy: Never
      # ── Security context ───────────────────────────────────────────────────
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534       # nobody
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      # ── Init container: compile the Go binary ─────────────────────────────
      initContainers:
        - name: build
          image: golang:1.21-alpine
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false   # go build needs write access to GOCACHE
            capabilities:
              drop: ["ALL"]
          workingDir: /workspace
          command:
            - sh
            - -c
            - |
              set -eu
              echo "[build] Copying sources..."
              cp -r /src/. /workspace/
              echo "[build] Compiling workflow-submitter..."
              go build \
                -trimpath \
                -ldflags="-s -w" \
                -o /out/workflow-submitter \
                ./cmd/workflow-submitter
              echo "[build] Binary size: $(du -sh /out/workflow-submitter | cut -f1)"
          env:
            - name: GOOS
              value: linux
            - name: GOARCH
              value: amd64
            - name: CGO_ENABLED
              value: "0"
            - name: GOPATH
              value: /go
          volumeMounts:
            - name: source-code
              mountPath: /src
              readOnly: true
            - name: binary-out
              mountPath: /out
            - name: go-cache
              mountPath: /go
      # ── Main container: execute the submitter ─────────────────────────────
      containers:
        - name: submit
          image: alpine:3.19
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          command:
            - /out/workflow-submitter
          args:
            - -workflow=/workflow/workflow.json
            - -name=$(MONITOR_NAME)
            - -url=$(MONITOR_URL)
            - -freq=$(MONITOR_FREQ)
            - -locations=$(MONITOR_LOCATIONS)
            - -app-id=$(MONITOR_APP_ID)
            - -tags=$(MONITOR_TAGS)
            - -device=$(MONITOR_DEVICE)
            - -load-time-ms=$(MONITOR_LOAD_TIME_MS)
            - -poll-sec=10
            - -timeout-sec=300
          env:
            # ── Credentials from Secret ────────────────────────────────────
            - name: DT_TENANT_URL
              valueFrom:
                secretKeyRef:
                  name: dynatrace-credentials
                  key: DT_TENANT_URL
            - name: DT_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: dynatrace-credentials
                  key: DT_API_TOKEN
            # ── Monitor parameters — override these per deployment ─────────
            - name: MONITOR_NAME
              value: "Browser Monitor Example"
            - name: MONITOR_URL
              value: "http://example.com"
            - name: MONITOR_FREQ
              value: "5"
            - name: MONITOR_LOCATIONS
              value: "GEOLOCATION-9999453BE4BDB3CD,SYNTHETIC_LOCATION-DF80ACFB688C583B"
            - name: MONITOR_APP_ID
              value: "APPLICATION-4ADF0EF407C7C545"
            - name: MONITOR_TAGS
              value: "example"
            - name: MONITOR_DEVICE
              value: "Desktop"
            - name: MONITOR_LOAD_TIME_MS
              value: "10000"
          volumeMounts:
            - name: binary-out
              mountPath: /out
              readOnly: true
            - name: workflow-definition
              mountPath: /workflow
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        # Source code volume — in production, mount from a ConfigMap or init
        # from an ACR image; shown here as emptyDir for illustration.
        - name: source-code
          emptyDir: {}
        - name: binary-out
          emptyDir: {}
        - name: go-cache
          emptyDir: {}
        - name: workflow-definition
          configMap:
            name: dynatrace-workflow-definition

---
# ─── (Optional) CronJob ───────────────────────────────────────────────────────
# Uncomment to run the submitter on a schedule (e.g. nightly drift detection).
# apiVersion: batch/v1
# kind: CronJob
# metadata:
#   name: dynatrace-workflow-submitter-scheduled
#   namespace: dynatrace-ops
# spec:
#   schedule: "0 6 * * *"      # 06:00 UTC daily
#   timeZone: "UTC"
#   concurrencyPolicy: Forbid
#   successfulJobsHistoryLimit: 3
#   failedJobsHistoryLimit: 3
#   jobTemplate:
#     spec:
#       backoffLimit: 1
#       template:
#         # ... (same spec as the Job above)
