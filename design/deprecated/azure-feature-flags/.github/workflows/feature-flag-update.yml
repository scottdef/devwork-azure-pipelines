# ────────────────────────────────────────────────────────────────────────────
# feature-flag-update.yml
#
# Triggered when app-feature-flags.json changes on main.
# 1. Logs into Azure via managed identity (OIDC)
# 2. Imports live flags from App Configuration
# 3. Runs compare-flags.py to report drift & missing flags
# 4. Runs terraform plan + apply to reconcile
# ────────────────────────────────────────────────────────────────────────────
name: "Feature Flag Update"

on:
  push:
    branches: [main]
    paths:
      - "app-feature-flags.json"
  pull_request:
    branches: [main]
    paths:
      - "app-feature-flags.json"
  workflow_dispatch:

permissions:
  id-token: write    # OIDC token for Azure login
  contents: read
  pull-requests: write

env:
  TF_DIR: terraform
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  # App Configuration target
  APP_CONFIG_NAME: ${{ vars.APP_CONFIG_NAME }}
  RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
  # Terraform backend
  TF_BACKEND_RESOURCE_GROUP: ${{ vars.TF_BACKEND_RESOURCE_GROUP }}
  TF_BACKEND_STORAGE_ACCOUNT: ${{ vars.TF_BACKEND_STORAGE_ACCOUNT }}
  TF_BACKEND_CONTAINER: ${{ vars.TF_BACKEND_CONTAINER }}

jobs:
  # ── Validate JSON syntax first (fast fail) ──────────────────────────────
  validate:
    name: Validate JSON
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate app-feature-flags.json
        run: |
          python3 -c "
          import json, sys
          with open('app-feature-flags.json') as f:
              flags = json.load(f)
          errors = []
          if not isinstance(flags, list):
              errors.append('Root must be a JSON array')
          for i, entry in enumerate(flags):
              if 'name' not in entry:
                  errors.append(f'Entry {i}: missing \"name\" key')
              if 'enabled' not in entry:
                  errors.append(f'Entry {i}: missing \"enabled\" key')
              elif not isinstance(entry.get('enabled'), bool):
                  errors.append(f'Entry {i}: \"enabled\" must be a boolean')
          if errors:
              for e in errors:
                  print(f'::error::{e}')
              sys.exit(1)
          names = [e['name'] for e in flags]
          dupes = [n for n in names if names.count(n) > 1]
          if dupes:
              print(f'::error::Duplicate flag names: {set(dupes)}')
              sys.exit(1)
          print(f'✓ {len(flags)} feature flags validated')
          "

  # ── Compare + Plan + Apply ──────────────────────────────────────────────
  deploy:
    name: Compare & Deploy Feature Flags
    needs: validate
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Azure Login (managed identity / OIDC) ──────────────────────────
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # ── Import existing flags and run comparison ────────────────────────
      - name: Compare flags against App Configuration
        id: compare
        run: |
          echo "::group::Flag Comparison Report"
          python3 scripts/compare-flags.py \
            --json-file app-feature-flags.json \
            --app-config-name "${APP_CONFIG_NAME}" \
            --resource-group "${RESOURCE_GROUP}"
          echo "::endgroup::"

      # ── Terraform Init ──────────────────────────────────────────────────
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init \
            -backend-config="resource_group_name=${TF_BACKEND_RESOURCE_GROUP}" \
            -backend-config="storage_account_name=${TF_BACKEND_STORAGE_ACCOUNT}" \
            -backend-config="container_name=${TF_BACKEND_CONTAINER}" \
            -backend-config="key=feature-flags.tfstate" \
            -backend-config="use_oidc=true"

      # ── Terraform Plan ──────────────────────────────────────────────────
      - name: Terraform Plan
        id: plan
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform plan \
            -var="app_configuration_name=${APP_CONFIG_NAME}" \
            -var="resource_group_name=${RESOURCE_GROUP}" \
            -var="feature_flags_file=../app-feature-flags.json" \
            -out=tfplan \
            -detailed-exitcode \
            -no-color 2>&1 | tee plan_output.txt

          EXIT_CODE=${PIPESTATUS[0]}
          echo "exit_code=${EXIT_CODE}" >> "$GITHUB_OUTPUT"

          # Exit code 2 = changes present (not an error)
          if [[ "${EXIT_CODE}" -eq 1 ]]; then
            exit 1
          fi

      # ── Post plan to PR (if PR event) ──────────────────────────────────
      - name: Post Plan to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('${{ env.TF_DIR }}/plan_output.txt', 'utf8');
            const truncated = plan.length > 60000
              ? plan.substring(0, 60000) + '\n... (truncated)'
              : plan;

            const body = `### Feature Flag Plan
            \`\`\`
            ${truncated}
            \`\`\`
            *Pusher: @${context.actor}*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      # ── Terraform Apply (only on push to main) ─────────────────────────
      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -auto-approve tfplan

      # ── Summary ─────────────────────────────────────────────────────────
      - name: Job Summary
        if: always()
        run: |
          echo "## Feature Flag Deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| App Configuration | \`${APP_CONFIG_NAME}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Resource Group | \`${RESOURCE_GROUP}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Environment | \`dev\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Trigger | \`${{ github.event_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Actor | @${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
