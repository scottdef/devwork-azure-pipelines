###############################################################################
# promote-prod.yml — Delta promotion: test → prod
#
# Same pattern as promote-test.yml.
# Diffs test branch against 'promoted/prod' tag.
###############################################################################
name: "Promote → Prod (delta)"

on:
  pull_request:
    branches: [prod]
    types: [opened, synchronize, reopened]

env:
  WORKSPACE: "synapse-workspace-prod"
  RESOURCE_GROUP: "rg-synapse-prod"
  TAG: "promoted/prod"

permissions:
  contents: write
  pull-requests: write

jobs:
  promote:
    name: "Validate → Filter → Deploy"
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
        with:
          ref: test
          fetch-depth: 0

      - name: Compute delta
        id: diff
        run: |
          if git rev-parse "${{ env.TAG }}" >/dev/null 2>&1; then
            BASE=$(git rev-parse "${{ env.TAG }}")
            echo "Last promotion: ${BASE:0:8}"
            git diff --name-only "${BASE}...HEAD" -- \
              pipeline/ dataset/ notebook/ trigger/ dataflow/ sqlscript/ linkedService/ \
              > /tmp/changed.txt 2>/dev/null || true
          else
            echo "First promotion — including all artifacts"
            find . \( -path './pipeline/*' -o -path './dataset/*' -o -path './notebook/*' \
              -o -path './trigger/*' -o -path './dataflow/*' -o -path './sqlscript/*' \
              -o -path './linkedService/*' \) -name '*.json' \
              | sed 's|^\./||' > /tmp/changed.txt
          fi
          COUNT=$(grep -c . /tmp/changed.txt || true)
          echo "count=${COUNT}" >> $GITHUB_OUTPUT
          echo "${COUNT} artifact file(s) in delta"

      - name: Exit early if nothing changed
        if: steps.diff.outputs.count == '0'
        run: echo "::notice::No changes since last promotion"

      - name: Validate
        if: steps.diff.outputs.count != '0'
        uses: Azure/synapse-workspace-deployment@V1.9.1
        with:
          TargetWorkspaceName: ${{ env.WORKSPACE }}
          ArtifactsFolder: ${{ github.workspace }}
          operation: validate

      - name: Filter and strip
        if: steps.diff.outputs.count != '0'
        id: filter
        run: |
          chmod +x scripts/filter-and-strip.sh
          ./scripts/filter-and-strip.sh \
            ExportedArtifacts/TemplateForWorkspace.json \
            ExportedArtifacts/TemplateParametersForWorkspace.json \
            /tmp/changed.txt

      - name: Azure Login
        if: steps.diff.outputs.count != '0' && steps.filter.outputs.skip_deploy != 'true'
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.SYNAPSE_SPN_ID }}","clientSecret":"${{ secrets.SYNAPSE_SPN_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

      - name: Stop triggers
        if: steps.diff.outputs.count != '0' && steps.filter.outputs.skip_deploy != 'true'
        run: |
          chmod +x scripts/toggle-triggers.sh
          ./scripts/toggle-triggers.sh stop ${{ env.WORKSPACE }}

      - name: Deploy
        if: steps.diff.outputs.count != '0' && steps.filter.outputs.skip_deploy != 'true'
        uses: Azure/synapse-workspace-deployment@V1.9.1
        with:
          TargetWorkspaceName: ${{ env.WORKSPACE }}
          TemplateFile: ExportedArtifacts/TemplateForWorkspace.json
          ParametersFile: ExportedArtifacts/TemplateParametersForWorkspace.json
          OverrideArmParameters: ./parameters/prod.parameters.yaml
          environment: Azure Public
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          clientId: ${{ secrets.SYNAPSE_SPN_ID }}
          clientSecret: ${{ secrets.SYNAPSE_SPN_SECRET }}
          subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          tenantId: ${{ secrets.AZURE_TENANT_ID }}
          DeleteArtifactsNotInTemplate: false
          operation: deploy

      - name: Start triggers
        if: always() && steps.diff.outputs.count != '0' && steps.filter.outputs.skip_deploy != 'true'
        run: ./scripts/toggle-triggers.sh start ${{ env.WORKSPACE }}

      - name: Update promotion tags
        if: steps.diff.outputs.count != '0' && steps.filter.outputs.skip_deploy != 'true'
        run: |
          SHA=$(git rev-parse HEAD)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git tag -d "${{ env.TAG }}" 2>/dev/null || true
          git push origin ":refs/tags/${{ env.TAG }}" 2>/dev/null || true
          git tag -a "${{ env.TAG }}" "$SHA" -m "Promoted to prod $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          git push origin "${{ env.TAG }}"

          REL="release/prod/$(date +'%Y%m%d.%H%M%S')"
          git tag -a "$REL" "$SHA" -m "Prod release ${SHA:0:8}"
          git push origin "$REL"
          echo "::notice::Production promoted: ${REL}"
