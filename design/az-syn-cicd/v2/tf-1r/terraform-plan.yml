###############################################################################
# terraform-plan.yml — Validate and plan Terraform changes on pull request
#
# Runs on PRs targeting main that modify terraform/ files.
# Downloads state from GitHub artifact, runs fmt/validate/plan, posts the
# plan output as a PR comment, and uploads the plan as an artifact.
###############################################################################
name: "Terraform Plan"

on:
  pull_request:
    branches: [main]
    paths:
      - "terraform/**"
      - "parameters/**"

permissions:
  contents: read
  pull-requests: write
  actions: read

concurrency:
  group: terraform-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: "Plan (${{ matrix.environment }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, test, prod]
        include:
          - environment: dev
            client_id_secret: SYNAPSE_DEV_SPN_ID
            client_secret_secret: SYNAPSE_DEV_SPN_SECRET
          - environment: test
            client_id_secret: SYNAPSE_TEST_SPN_ID
            client_secret_secret: SYNAPSE_TEST_SPN_SECRET
          - environment: prod
            client_id_secret: SYNAPSE_PROD_SPN_ID
            client_secret_secret: SYNAPSE_PROD_SPN_SECRET

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      # ── Restore state from GitHub artifact ──
      - name: Download Terraform state
        uses: actions/download-artifact@v4
        with:
          name: "tfstate-${{ matrix.environment }}"
          path: terraform/
        continue-on-error: true  # First run has no artifact

      # Also try fetching from previous workflow runs
      - name: Restore state from previous runs
        if: hashFiles('terraform/terraform.tfstate') == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd terraform
          gh run download --name "tfstate-${{ matrix.environment }}" --dir . 2>/dev/null || \
            echo "No previous state found — will initialize fresh"

      - name: Terraform Format Check
        id: fmt
        run: terraform -chdir=terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init
        id: init
        run: terraform -chdir=terraform init -input=false

      - name: Terraform Validate
        id: validate
        run: terraform -chdir=terraform validate -no-color

      - name: Terraform Plan
        id: plan
        env:
          TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          TF_VAR_client_id: ${{ secrets[matrix.client_id_secret] }}
          TF_VAR_client_secret: ${{ secrets[matrix.client_secret_secret] }}
        run: |
          terraform -chdir=terraform plan \
            -var-file="environments/${{ matrix.environment }}.tfvars" \
            -no-color \
            -out="tfplan-${{ matrix.environment }}" \
            2>&1 | tee plan-output.txt
        continue-on-error: true

      - name: Post Plan to PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        env:
          PLAN: ${{ steps.plan.outputs.stdout }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let planOutput = '';
            try {
              planOutput = fs.readFileSync('plan-output.txt', 'utf8');
            } catch (e) {
              planOutput = 'Plan output not available';
            }
            // Truncate if too long for GitHub comment
            if (planOutput.length > 60000) {
              planOutput = planOutput.substring(0, 60000) + '\n\n... (truncated)';
            }

            const output = `### Terraform Plan — \`${{ matrix.environment }}\`
            | Step | Status |
            |------|--------|
            | Format | \`${{ steps.fmt.outcome }}\` |
            | Init | \`${{ steps.init.outcome }}\` |
            | Validate | \`${{ steps.validate.outcome }}\` |
            | Plan | \`${{ steps.plan.outcome }}\` |

            <details><summary>Show Plan</summary>

            \`\`\`terraform
            ${planOutput}
            \`\`\`

            </details>

            *Triggered by: @${{ github.actor }} on \`${{ github.head_ref }}\`*`;

            // Find existing comment to update
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const marker = `### Terraform Plan — \`${{ matrix.environment }}\``;
            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: output,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: output,
              });
            }

      - name: Plan Status
        if: steps.plan.outcome == 'failure'
        run: exit 1
