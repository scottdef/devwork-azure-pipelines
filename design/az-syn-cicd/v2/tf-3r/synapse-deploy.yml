###############################################################################
# synapse-deploy.yml — Deploy to dev workspace, promote to test repo
#
# Trigger modes:
#   1. Push to workspace_publish (Synapse Studio "Publish" button)
#   2. Manual dispatch with validateDeploy (bypasses manual publish)
#
# After successful dev deployment:
#   - Tags the release on this repo (synapse-repo-dev)
#   - Fires workflow_dispatch on synapse-repo-test to continue promotion
#
# The test repo checks out this repo at the tag to get the ARM templates.
###############################################################################
name: "Synapse Deploy"

on:
  push:
    branches: [workspace_publish]
  push:  # yamllint disable-line — dual push triggers intentional
    branches: [main]
    paths:
      - "pipeline/**"
      - "dataset/**"
      - "linkedService/**"
      - "notebook/**"
      - "trigger/**"
      - "dataflow/**"
      - "sqlscript/**"
  workflow_dispatch:
    inputs:
      deploy_mode:
        description: "validateDeploy (from main) or deploy (from workspace_publish)"
        type: choice
        options:
          - validateDeploy
          - deploy
        default: validateDeploy
      promote_to_test:
        description: "Trigger test deployment after dev succeeds"
        type: boolean
        default: true

env:
  WORKSPACE: "synapse-workspace-dev"
  RESOURCE_GROUP: "rg-synapse-dev"
  TEMPLATE_FILE: "./synapse-workspace-dev/TemplateForWorkspace.json"
  PARAMS_FILE: "./synapse-workspace-dev/TemplateParametersForWorkspace.json"
  ORG: ${{ github.repository_owner }}

permissions:
  contents: write
  actions: write

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # DEPLOY TO DEV
  # ═══════════════════════════════════════════════════════════════════════════
  deploy-dev:
    name: "Deploy → Dev"
    runs-on: ubuntu-latest
    environment: dev
    outputs:
      release_tag: ${{ steps.tag.outputs.tag }}
      deploy_mode: ${{ steps.mode.outputs.mode }}
    steps:
      - name: Determine deploy mode
        id: mode
        run: |
          if [ "${{ github.ref_name }}" = "workspace_publish" ]; then
            echo "mode=deploy" >> $GITHUB_OUTPUT
            echo "branch=workspace_publish" >> $GITHUB_OUTPUT
          else
            echo "mode=${{ inputs.deploy_mode || 'validateDeploy' }}" >> $GITHUB_OUTPUT
            echo "branch=main" >> $GITHUB_OUTPUT
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.mode.outputs.branch }}
          fetch-depth: 0  # full history for tagging

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.SYNAPSE_SPN_ID }}",
              "clientSecret": "${{ secrets.SYNAPSE_SPN_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
            }

      - name: Stop triggers
        run: |
          chmod +x scripts/toggle-triggers.sh
          ./scripts/toggle-triggers.sh stop "${{ env.WORKSPACE }}"

      # ── Deploy from workspace_publish (ARM templates) ──
      - name: Deploy (publish branch)
        if: steps.mode.outputs.mode == 'deploy'
        uses: Azure/synapse-workspace-deployment@V1.9.1
        with:
          TargetWorkspaceName: ${{ env.WORKSPACE }}
          TemplateFile: ${{ env.TEMPLATE_FILE }}
          ParametersFile: ${{ env.PARAMS_FILE }}
          OverrideArmParameters: "./parameters/dev.parameters.yaml"
          environment: "Azure Public"
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          clientId: ${{ secrets.SYNAPSE_SPN_ID }}
          clientSecret: ${{ secrets.SYNAPSE_SPN_SECRET }}
          subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          tenantId: ${{ secrets.AZURE_TENANT_ID }}
          DeleteArtifactsNotInTemplate: true
          operation: "deploy"

      # ── Deploy from collaboration branch (no manual publish) ──
      - name: Deploy (validateDeploy)
        if: steps.mode.outputs.mode == 'validateDeploy'
        uses: Azure/synapse-workspace-deployment@V1.9.1
        with:
          TargetWorkspaceName: ${{ env.WORKSPACE }}
          ArtifactsFolder: "${{ github.workspace }}"
          OverrideArmParameters: "./parameters/dev.parameters.yaml"
          environment: "Azure Public"
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          clientId: ${{ secrets.SYNAPSE_SPN_ID }}
          clientSecret: ${{ secrets.SYNAPSE_SPN_SECRET }}
          subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          tenantId: ${{ secrets.AZURE_TENANT_ID }}
          DeleteArtifactsNotInTemplate: true
          operation: "validateDeploy"

      - name: Start triggers
        if: always()
        run: ./scripts/toggle-triggers.sh start "${{ env.WORKSPACE }}"

      # ── Tag the release on this repo ──
      - name: Tag release
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="synapse-v$(date +'%Y%m%d.%H%M%S')"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Dev deployment ${TAG} — mode: ${{ steps.mode.outputs.mode }}"
          git push origin "$TAG"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "::notice::Tagged as ${TAG}"

      - name: Summary
        run: |
          echo "## Synapse Deploy → Dev :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag**: \`${{ steps.tag.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Mode**: ${{ steps.mode.outputs.mode }}" >> $GITHUB_STEP_SUMMARY

  # ═══════════════════════════════════════════════════════════════════════════
  # PROMOTE TO TEST (cross-repo dispatch)
  # ═══════════════════════════════════════════════════════════════════════════
  promote-to-test:
    name: "Promote → synapse-repo-test"
    needs: deploy-dev
    if: ${{ inputs.promote_to_test != false }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger test deployment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_APP_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: '${{ env.ORG }}',
              repo: 'synapse-repo-test',
              workflow_id: 'synapse-deploy.yml',
              ref: 'main',
              inputs: {
                source_tag: '${{ needs.deploy-dev.outputs.release_tag }}',
                source_repo: '${{ github.repository }}',
                deploy_mode: '${{ needs.deploy-dev.outputs.deploy_mode }}',
              },
            });
            console.log('Dispatched synapse-repo-test with tag: ${{ needs.deploy-dev.outputs.release_tag }}');

      - name: Summary
        run: |
          echo "## Promotion → Test :arrow_right:" >> $GITHUB_STEP_SUMMARY
          echo "- **Target**: synapse-repo-test" >> $GITHUB_STEP_SUMMARY
          echo "- **Source tag**: \`${{ needs.deploy-dev.outputs.release_tag }}\`" >> $GITHUB_STEP_SUMMARY
