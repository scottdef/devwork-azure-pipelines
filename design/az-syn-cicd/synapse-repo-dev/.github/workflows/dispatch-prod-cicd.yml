###############################################################################
# dispatch-prod-cicd.yml
# Repository: synapse-repo-dev
#
# Triggers when test branch is merged into prod branch (push→prod).
# Uses the GitHub App to dispatch synapse-prod-cicd-workflow in synapse-repo-prod,
# passing the source commit SHA and branch so it can clone the right code.
#
# Required vars (repo-level):
#   GH_APP_ID
###############################################################################
name: dispatch-prod-cicd

on:
  push:
    branches:
      - prod
    paths:
      - 'pipeline/**'
      - 'dataset/**'
      - 'linkedService/**'
      - 'notebook/**'
      - 'trigger/**'
      - 'dataflow/**'
      - 'sqlscript/**'
      - 'credential/**'
      - 'sparkJobDefinition/**'
      - 'template-parameters-definition.json'

concurrency:
  group: dispatch-prod
  cancel-in-progress: false   # never cancel production dispatches

jobs:
  dispatch:
    name: dispatch-to-prod-repo
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id:      ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner:       ${{ github.repository_owner }}

      - name: Dispatch synapse-prod-cicd-workflow
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          DATESTAMP="$(date -u '+%Y.%m.%d')"
          DEV_RELEASE="prod-${DATESTAMP}.${{ github.run_number }}"

          echo "==> Dispatching to synapse-repo-prod"
          echo "    source_sha:    ${{ github.sha }}"
          echo "    source_branch: prod"
          echo "    dev_release:   ${DEV_RELEASE}"

          gh workflow run synapse-prod-cicd-workflow.yml \
            --repo "${{ github.repository_owner }}/synapse-repo-prod" \
            --field "source_sha=${{ github.sha }}" \
            --field "source_branch=prod" \
            --field "dev_release=${DEV_RELEASE}" \
            --field "triggered_by=${{ github.actor }}"

          echo "==> Dispatch sent to synapse-repo-prod"

      - name: Dispatch summary
        run: |
          echo "## 🚀 Dispatched: synapse-prod-cicd-workflow" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Target repo | \`synapse-repo-prod\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Source SHA | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Source branch | \`prod\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Triggered by | \`${{ github.actor }}\` |" >> "$GITHUB_STEP_SUMMARY"
