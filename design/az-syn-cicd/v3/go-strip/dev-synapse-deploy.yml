###############################################################################
# synapse-deploy.yml — Three-phase deployment for synapse-repo-dev
#
# Phase 1: validate — Generate ARM templates from collaboration branch
# Phase 2: strip   — Remove all linked services from templates
# Phase 3: deploy  — Deploy stripped templates to workspace
#
# Linked services are managed exclusively through Synapse Studio UI.
# They never flow through CI/CD.  This eliminates the divergent name
# problem entirely for linked services.
###############################################################################
name: "Synapse Deploy"

on:
  push:
    branches: [main]
    paths:
      - "pipeline/**"
      - "dataset/**"
      - "notebook/**"
      - "trigger/**"
      - "dataflow/**"
      - "sqlscript/**"
  workflow_dispatch:
    inputs:
      promote_to_test:
        description: "Trigger test deployment after dev"
        type: boolean
        default: true

env:
  WORKSPACE: "synapse-workspace-dev"
  RESOURCE_GROUP: "rg-synapse-dev"
  ORG: ${{ github.repository_owner }}

permissions:
  contents: write
  actions: write

jobs:
  deploy-dev:
    name: "Validate → Strip → Deploy (dev)"
    runs-on: ubuntu-latest
    environment: dev
    outputs:
      release_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache: false

      - name: Build strip tool
        run: |
          cd tools/strip-linked-services
          go build -o "$GITHUB_WORKSPACE/strip-linked-services" .

      # ════════════════════════════════════════════════════════════════════
      # PHASE 1: Validate — generate ARM templates from artifact JSON files
      # ════════════════════════════════════════════════════════════════════
      - name: "Phase 1: Validate (generate ARM templates)"
        uses: Azure/synapse-workspace-deployment@V1.9.1
        with:
          TargetWorkspaceName: ${{ env.WORKSPACE }}
          ArtifactsFolder: "${{ github.workspace }}"
          operation: "validate"

      - name: Verify generated templates
        run: |
          TEMPLATE="ExportedArtifacts/TemplateForWorkspace.json"
          PARAMS="ExportedArtifacts/TemplateParametersForWorkspace.json"
          test -f "$TEMPLATE" || { echo "::error::Template not generated"; exit 1; }
          test -f "$PARAMS"   || { echo "::error::Parameters not generated"; exit 1; }

          RESOURCE_COUNT=$(jq '.resources | length' "$TEMPLATE")
          LS_COUNT=$(jq '[.resources[] | select(.type | endswith("/linkedServices"))] | length' "$TEMPLATE")
          echo "Generated template: ${RESOURCE_COUNT} resources, ${LS_COUNT} linked services"

      # ════════════════════════════════════════════════════════════════════
      # PHASE 2: Strip — remove all linked services from templates
      # ════════════════════════════════════════════════════════════════════
      - name: "Phase 2: Strip linked services"
        run: |
          ./strip-linked-services \
            -template "ExportedArtifacts/TemplateForWorkspace.json" \
            -params   "ExportedArtifacts/TemplateParametersForWorkspace.json"

      - name: Verify stripped templates
        run: |
          REMAINING_LS=$(jq '[.resources[] | select(.type | endswith("/linkedServices"))] | length' \
            ExportedArtifacts/TemplateForWorkspace.json)
          if [ "$REMAINING_LS" -ne 0 ]; then
            echo "::error::${REMAINING_LS} linked services still in template after strip"
            exit 1
          fi
          echo "Verified: 0 linked services in stripped template"

      # ════════════════════════════════════════════════════════════════════
      # PHASE 3: Deploy — apply stripped templates to workspace
      # ════════════════════════════════════════════════════════════════════
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.SYNAPSE_SPN_ID }}",
              "clientSecret": "${{ secrets.SYNAPSE_SPN_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
            }

      - name: Stop triggers
        run: |
          chmod +x scripts/toggle-triggers.sh
          ./scripts/toggle-triggers.sh stop "${{ env.WORKSPACE }}"

      - name: "Phase 3: Deploy (stripped templates)"
        uses: Azure/synapse-workspace-deployment@V1.9.1
        with:
          TargetWorkspaceName: ${{ env.WORKSPACE }}
          TemplateFile: "ExportedArtifacts/TemplateForWorkspace.json"
          ParametersFile: "ExportedArtifacts/TemplateParametersForWorkspace.json"
          OverrideArmParameters: "./parameters/dev.parameters.yaml"
          environment: "Azure Public"
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          clientId: ${{ secrets.SYNAPSE_SPN_ID }}
          clientSecret: ${{ secrets.SYNAPSE_SPN_SECRET }}
          subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          tenantId: ${{ secrets.AZURE_TENANT_ID }}
          DeleteArtifactsNotInTemplate: true
          operation: "deploy"

      - name: Start triggers
        if: always()
        run: ./scripts/toggle-triggers.sh start "${{ env.WORKSPACE }}"

      - name: Tag release
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="synapse-v$(date +'%Y%m%d.%H%M%S')"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Deploy ${TAG} — linked services excluded"
          git push origin "$TAG"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Summary
        run: |
          echo "## Deploy → Dev :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag**: \`${{ steps.tag.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Strategy**: validate → strip linked services → deploy" >> $GITHUB_STEP_SUMMARY

  promote-to-test:
    name: "Promote → test"
    needs: deploy-dev
    if: inputs.promote_to_test != false
    runs-on: ubuntu-latest
    steps:
      - name: Trigger test deployment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_APP_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: '${{ env.ORG }}',
              repo: 'synapse-repo-test',
              workflow_id: 'synapse-deploy.yml',
              ref: 'main',
              inputs: {
                source_tag: '${{ needs.deploy-dev.outputs.release_tag }}',
              },
            });
