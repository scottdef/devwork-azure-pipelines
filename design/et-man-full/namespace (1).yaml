---
apiVersion: v1
kind: Namespace
metadata:
  name: easytrade
  labels:
    app.kubernetes.io/name: easytrade
    app.kubernetes.io/managed-by: kubectl
    istio-injection: enabled
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: easytrade-quota
  namespace: easytrade
spec:
  hard:
    requests.cpu: "16"
    requests.memory: "32Gi"
    limits.cpu: "32"
    limits.memory: "64Gi"
    persistentvolumeclaims: "10"
    services.loadbalancers: "2"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: easytrade-limits
  namespace: easytrade
spec:
  limits:
    - default:
        cpu: "1"
        memory: "1Gi"
      defaultRequest:
        cpu: "100m"
        memory: "128Mi"
      type: Container
