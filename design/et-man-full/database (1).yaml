---
apiVersion: v1
kind: ConfigMap
metadata:
  name: easytrade-config
  namespace: easytrade
data:
  DB_HOST: "db"
  DB_PORT: "1433"
  DB_NAME: "TradeManagement"
  PROXY_HOST: "frontendreverseproxy"
  PROXY_PORT: "80"
---
apiVersion: v1
kind: Secret
metadata:
  name: easytrade-db-secret
  namespace: easytrade
type: Opaque
stringData:
  SA_PASSWORD: "yourStrong(!)Password"
  DB_USER: "sa"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: db-pvc
  namespace: easytrade
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: managed-csi
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: easytrade
  labels:
    app: db
    app.kubernetes.io/name: easytrade
    app.kubernetes.io/component: database
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
        app.kubernetes.io/name: easytrade
        app.kubernetes.io/component: database
    spec:
      containers:
        - name: mssql
          image: mcr.microsoft.com/mssql/server:2022-latest
          ports:
            - containerPort: 1433
              name: mssql
          env:
            - name: ACCEPT_EULA
              value: "Y"
            - name: MSSQL_SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: easytrade-db-secret
                  key: SA_PASSWORD
          resources:
            requests:
              cpu: "500m"
              memory: "2Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          volumeMounts:
            - name: mssqldb
              mountPath: /var/opt/mssql
          livenessProbe:
            tcpSocket:
              port: 1433
            initialDelaySeconds: 45
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 1433
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 3
      volumes:
        - name: mssqldb
          persistentVolumeClaim:
            claimName: db-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: easytrade
  labels:
    app: db
spec:
  type: ClusterIP
  ports:
    - port: 1433
      targetPort: 1433
      protocol: TCP
      name: mssql
  selector:
    app: db
