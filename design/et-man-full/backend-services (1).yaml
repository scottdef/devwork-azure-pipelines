---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: accountservice
  namespace: easytrade
  labels:
    app: accountservice
    app.kubernetes.io/name: easytrade
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: accountservice
  template:
    metadata:
      labels:
        app: accountservice
        app.kubernetes.io/name: easytrade
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: accountservice
          image: europe-docker.pkg.dev/dynatrace-demoability/docker/easytrade/accountservice:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8089
              name: http
          env:
            - name: MSSQL_HOST
              value: "db"
            - name: MSSQL_PORT
              value: "1433"
            - name: MSSQL_USER
              value: "sa"
            - name: MSSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: easytrade-db-secret
                  key: SA_PASSWORD
            - name: MSSQL_DB
              value: "TradeManagement"
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8089
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8089
            initialDelaySeconds: 20
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: accountservice
  namespace: easytrade
  labels:
    app: accountservice
spec:
  type: ClusterIP
  ports:
    - port: 8089
      targetPort: 8089
      protocol: TCP
      name: http
  selector:
    app: accountservice
