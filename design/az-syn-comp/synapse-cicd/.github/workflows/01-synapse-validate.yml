name: "01 · Synapse Validate"

on:
  pull_request:
    branches: [main]
    paths:
      - "pipeline/**"
      - "dataset/**"
      - "linkedService/**"
      - "notebook/**"
      - "trigger/**"
      - "dataflow/**"
      - "sqlscript/**"
      - "parameters/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    name: Validate Synapse Artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate artifacts
        id: validate
        uses: Azure/synapse-workspace-deployment@V1.9.1
        with:
          TargetWorkspaceName: ${{ vars.SYNAPSE_WORKSPACE_DEV }}
          ArtifactsFolder: "${{ github.workspace }}"
          operation: "validate"

      - name: Upload ARM templates
        uses: actions/upload-artifact@v4
        with:
          name: synapse-arm-templates-${{ github.sha }}
          path: "${{ github.workspace }}/ExportedArtifacts/"
          retention-days: 5

      - name: Post result to PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const ok = '${{ steps.validate.outcome }}' === 'success';
            const body = [
              `## ${ok ? '✅' : '❌'} Synapse Validation: \`${{ steps.validate.outcome }}\``,
              '',
              `**Workspace:** \`${{ vars.SYNAPSE_WORKSPACE_DEV }}\``,
              `**Commit:** \`${{ github.sha }}\``,
              '',
              ok ? 'ARM templates generated and uploaded.' : 'Validation failed — see workflow logs.',
              '',
              `---`,
              `*[Run #${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})*`
            ].join('\n');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
