name: "04 · Synapse Promote → PROD"

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: "Test release tag to promote"
        required: true
        type: string
      confirm_production:
        description: "Type DEPLOY to confirm"
        required: true
        type: string

permissions:
  contents: write
  actions: write

jobs:
  confirm:
    name: Confirm
    runs-on: ubuntu-latest
    steps:
      - name: Gate
        run: |
          if [ "${{ inputs.confirm_production }}" != "DEPLOY" ]; then
            echo "::error::Type 'DEPLOY' to confirm." && exit 1
          fi

  deploy-prod:
    name: "Deploy → PROD"
    needs: confirm
    runs-on: ubuntu-latest
    environment: production
    env:
      WORKSPACE: ${{ vars.SYNAPSE_WORKSPACE_PROD }}
    steps:
      - name: Checkout test repo at tag
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.GITHUB_ORG }}/synapse-repo-test
          ref: ${{ inputs.source_tag }}
          token: ${{ secrets.GH_APP_TOKEN }}
          path: source

      - name: Checkout prod repo
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.GITHUB_ORG }}/synapse-repo-prod
          token: ${{ secrets.GH_APP_TOKEN }}
          path: target

      - name: Sync artifacts test → prod
        run: |
          for dir in pipeline dataset linkedService notebook trigger dataflow sqlscript parameters; do
            [ -d "source/$dir" ] && rm -rf "target/$dir" && cp -r "source/$dir" "target/$dir" && echo "Synced: $dir"
          done

      - name: Commit to prod repo
        working-directory: target
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet && echo "No changes." && exit 0
          git commit -m "Production from ${{ inputs.source_tag }} by ${{ github.actor }}"
          git push

      - uses: azure/login@v2
        with:
          creds: >-
            {"clientId":"${{ secrets.SYNAPSE_PROD_SPN_ID }}",
             "clientSecret":"${{ secrets.SYNAPSE_PROD_SPN_SECRET }}",
             "subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}",
             "tenantId":"${{ secrets.AZURE_TENANT_ID }}"}

      - name: Stop triggers
        run: |
          set -euo pipefail
          triggers=$(az synapse trigger list \
            --workspace-name "$WORKSPACE" \
            --query "[?properties.runtimeState=='Started'].name" -o tsv)
          [ -z "$triggers" ] && echo "[]" > active-triggers.json && exit 0
          echo "$triggers" | jq -R -s 'split("\n")|map(select(.!=""))' > active-triggers.json
          while IFS= read -r t; do
            [ -z "$t" ] && continue
            az synapse trigger stop --workspace-name "$WORKSPACE" --name "$t" || true
          done <<< "$triggers"

      - name: Deploy to PROD
        uses: Azure/synapse-workspace-deployment@V1.9.1
        with:
          TargetWorkspaceName: ${{ vars.SYNAPSE_WORKSPACE_PROD }}
          ArtifactsFolder: "${{ github.workspace }}/target"
          OverrideArmParameters: "./target/parameters/prod.parameters.yaml"
          environment: "Azure Public"
          resourceGroup: ${{ vars.RESOURCE_GROUP_PROD }}
          clientId: ${{ secrets.SYNAPSE_PROD_SPN_ID }}
          clientSecret: ${{ secrets.SYNAPSE_PROD_SPN_SECRET }}
          subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          tenantId: ${{ secrets.AZURE_TENANT_ID }}
          DeleteArtifactsNotInTemplate: true
          operation: "validateDeploy"

      - name: Restart triggers
        if: always()
        run: |
          sleep 15
          [ ! -f active-triggers.json ] && exit 0
          mapfile -t names < <(jq -r '.[]' active-triggers.json)
          for name in "${names[@]}"; do
            [ -z "$name" ] && continue
            for i in 1 2 3; do
              az synapse trigger start --workspace-name "$WORKSPACE" --name "$name" 2>/dev/null && break
              sleep 5
            done
          done

      - name: Tag and notify
        working-directory: target
        run: |
          V="prod-$(date +'%Y%m%d.%H%M%S')"
          git tag -a "$V" -m "Production: $V (from ${{ inputs.source_tag }})"
          git push origin "$V"
          echo "::notice::PROD tagged $V"

      - name: Webhook
        if: success() && vars.PROD_WEBHOOK_URL != ''
        run: |
          curl -sS -X POST "${{ vars.PROD_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{"event":"prod_deploy","workspace":"${{ vars.SYNAPSE_WORKSPACE_PROD }}","tag":"${{ inputs.source_tag }}","actor":"${{ github.actor }}"}'
