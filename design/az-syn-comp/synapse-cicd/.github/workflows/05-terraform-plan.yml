name: "05 · Terraform Plan"

on:
  pull_request:
    branches: [main]
    paths: ["terraform/**"]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options: [dev, test, prod]

permissions:
  contents: read
  pull-requests: write
  actions: write

jobs:
  plan:
    name: "Plan · ${{ matrix.environment }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: dev
            spn_id: SYNAPSE_DEV_SPN_ID
            spn_secret: SYNAPSE_DEV_SPN_SECRET
          - environment: test
            spn_id: SYNAPSE_TEST_SPN_ID
            spn_secret: SYNAPSE_TEST_SPN_SECRET
          - environment: prod
            spn_id: SYNAPSE_PROD_SPN_ID
            spn_secret: SYNAPSE_PROD_SPN_SECRET
    env:
      TF_IN_AUTOMATION: "true"
      ARM_CLIENT_ID: ${{ secrets[matrix.spn_id] }}
      ARM_CLIENT_SECRET: ${{ secrets[matrix.spn_secret] }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Download state
        uses: actions/download-artifact@v4
        with:
          name: terraform-state-${{ matrix.environment }}
          path: terraform/
        continue-on-error: true

      - name: State info
        run: |
          if [ -f terraform.tfstate ]; then
            echo "State: $(wc -c < terraform.tfstate) bytes, $(jq '.resources|length' terraform.tfstate) resources"
          else
            echo "No previous state — initial plan."
          fi

      - name: Init
        id: init
        run: terraform init -input=false

      - name: Format check
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Validate
        id: validate
        run: terraform validate -no-color

      - name: Plan
        id: plan
        run: |
          terraform plan \
            -var-file="environments/${{ matrix.environment }}.tfvars" \
            -input=false -no-color -out=tfplan 2>&1 | tee plan.txt
        continue-on-error: true

      - name: Upload plan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ matrix.environment }}-${{ github.sha }}
          path: |
            terraform/tfplan
            terraform/plan.txt
          retention-days: 5

      - name: Upload state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-state-${{ matrix.environment }}
          path: terraform/terraform.tfstate
          retention-days: 90
          overwrite: true

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let plan = 'N/A';
            try { plan = fs.readFileSync('terraform/plan.txt','utf8'); } catch {}
            if (plan.length > 60000) plan = plan.substring(0,60000) + '\n...(truncated)';
            const body = [
              `## Terraform Plan — \`${{ matrix.environment }}\``,
              `| Step | Result |`,
              `|------|--------|`,
              `| fmt | \`${{ steps.fmt.outcome }}\` |`,
              `| init | \`${{ steps.init.outcome }}\` |`,
              `| validate | \`${{ steps.validate.outcome }}\` |`,
              `| plan | \`${{ steps.plan.outcome }}\` |`,
              ``,
              `<details><summary>Plan output</summary>`,
              ``,
              '```terraform',
              plan,
              '```',
              `</details>`,
              ``,
              `*[Run #${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})*`
            ].join('\n');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

      - name: Fail on error
        if: steps.plan.outcome == 'failure'
        run: exit 1
