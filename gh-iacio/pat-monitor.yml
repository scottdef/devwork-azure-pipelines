name: PAT Activity Monitor

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  # For org audit log access
  administration: read

jobs:
  monitor-pat-activity:
    runs-on: ubuntu-latest
    steps:
      - name: Check audit log for PAT activity
        id: check_audit
        env:
          GH_TOKEN: ${{ github.token }}
          ORG: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          
          # Get timestamp from 6 hours ago in RFC3339 format
          since=$(date -u -d '6 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          
          # Query audit log for PAT-related events
          # Events: personal_access_token.*, oauth_access.*
          events=$(gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/orgs/${ORG}/audit-log" \
            -F phrase="action:personal_access_token.* action:oauth_access.*" \
            -F per_page=100 \
            --jq '.[] | select(.created_at >= "'$since'")' 2>/dev/null || echo "")
          
          if [ -z "$events" ]; then
            echo "found=false" >> $GITHUB_OUTPUT
            echo "No PAT activity detected in the last 6 hours"
            exit 0
          fi
          
          echo "found=true" >> $GITHUB_OUTPUT
          
          # Format findings for issue body
          {
            echo "## 🔐 Personal Access Token Activity Detected"
            echo ""
            echo "**Detection Time:** $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "**Query Period:** Last 6 hours"
            echo ""
            echo "### Events"
            echo ""
            echo '```json'
            echo "$events" | jq -s '.'
            echo '```'
            echo ""
            echo "### Summary"
            echo ""
            echo "$events" | jq -r '"- **Action:** \(.action) | **Actor:** \(.actor) | **Time:** \(.created_at)"'
            echo ""
            echo "---"
            echo "_Generated by PAT Activity Monitor_"
          } > /tmp/issue_body.md
          
          # Create hash of events to prevent duplicate issues
          event_hash=$(echo "$events" | sha256sum | cut -d' ' -f1 | cut -c1-8)
          echo "event_hash=$event_hash" >> $GITHUB_OUTPUT

      - name: Check for existing issue
        if: steps.check_audit.outputs.found == 'true'
        id: check_issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          hash="${{ steps.check_audit.outputs.event_hash }}"
          existing=$(gh issue list \
            --repo "${{ github.repository }}" \
            --label "security,pat-activity" \
            --search "PAT Activity $hash in:title" \
            --json number \
            --jq '.[0].number // empty')
          
          if [ -n "$existing" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Issue already exists: #$existing"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create issue
        if: steps.check_audit.outputs.found == 'true' && steps.check_issue.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          hash="${{ steps.check_audit.outputs.event_hash }}"
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "🔐 PAT Activity Detected [$hash]" \
            --body-file /tmp/issue_body.md \
            --label "security,pat-activity,automated"
          
          echo "Issue created successfully"

      - name: Notify on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "⚠️ PAT Monitor Failed" \
            --body "The PAT activity monitor workflow failed. Check the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})." \
            --label "security,monitoring,failure"
