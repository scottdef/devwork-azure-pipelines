name: Cross-Repo File Generation

# Advanced version - clones external repo, generates files, creates PR

on:
  workflow_dispatch:
    inputs:
      owner:
        description: 'Repository owner'
        required: true
        type: string
      repo:
        description: 'Repository name'
        required: true
        type: string
      branch:
        description: 'Branch name'
        required: false
        default: 'auto-generated-files'
        type: string

permissions:
  contents: write
  pull-requests: write

env:
  TARGET_REPO: ${{ github.event.inputs.owner }}/${{ github.event.inputs.repo }}
  BRANCH_NAME: ${{ github.event.inputs.branch }}

jobs:
  generate-and-pr:
    runs-on: ubuntu-latest
    
    steps:
      - name: Clone Target Repository
        run: |
          echo "Cloning repository: ${TARGET_REPO}"
          
          # Clone with token for authentication
          git clone "https://x-access-token:${{ secrets.GH_ADMIN_TOKEN }}@github.com/${TARGET_REPO}.git" repo
          
          cd repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          echo "✓ Repository cloned"

      - name: Setup Branch
        working-directory: ./repo
        run: |
          # Remove branch if exists
          git push origin --delete "${BRANCH_NAME}" 2>/dev/null || true
          git branch -D "${BRANCH_NAME}" 2>/dev/null || true
          
          # Create new branch
          git checkout -b "${BRANCH_NAME}"
          
          echo "✓ Branch ${BRANCH_NAME} created"

      - name: Create Directory Structure
        working-directory: ./repo
        run: |
          # Create main directory
          mkdir -p here-files
          
          # Create subdirectories
          mkdir -p here-files/configs
          mkdir -p here-files/scripts
          mkdir -p here-files/docs
          
          echo "✓ Directory structure created"

      - name: Generate Configuration Files
        working-directory: ./repo
        run: |
          # Generate .env template
          cat > here-files/configs/.env.template <<'EOF'
          # Environment Configuration Template
          # Copy to .env and fill in values
          
          # Application Settings
          APP_NAME=my-app
          APP_ENV=production
          APP_DEBUG=false
          APP_PORT=3000
          
          # Database
          DB_HOST=localhost
          DB_PORT=5432
          DB_NAME=mydb
          DB_USER=
          DB_PASSWORD=
          
          # Redis Cache
          REDIS_HOST=localhost
          REDIS_PORT=6379
          REDIS_PASSWORD=
          
          # API Keys (DO NOT COMMIT ACTUAL KEYS)
          API_KEY=
          SECRET_KEY=
          
          # External Services
          SENTRY_DSN=
          SLACK_WEBHOOK=
          
          # Generated: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          EOF
          
          # Generate app config
          cat > here-files/configs/app-config.json <<'EOF'
          {
            "app": {
              "name": "MyApplication",
              "version": "1.0.0",
              "environment": "production"
            },
            "server": {
              "port": 3000,
              "host": "0.0.0.0",
              "timeout": 30000
            },
            "database": {
              "pool_size": 10,
              "timeout": 5000,
              "retry_attempts": 3
            },
            "cache": {
              "enabled": true,
              "ttl": 3600,
              "max_items": 1000
            },
            "logging": {
              "level": "info",
              "format": "json",
              "outputs": ["console", "file"]
            }
          }
          EOF
          
          # Generate logging config
          cat > here-files/configs/logging.yml <<'EOF'
          version: 1
          
          formatters:
            simple:
              format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
            json:
              format: '{"time":"%(asctime)s","level":"%(levelname)s","msg":"%(message)s"}'
          
          handlers:
            console:
              class: logging.StreamHandler
              level: INFO
              formatter: simple
              stream: ext://sys.stdout
          
            file:
              class: logging.handlers.RotatingFileHandler
              level: INFO
              formatter: json
              filename: app.log
              maxBytes: 10485760
              backupCount: 3
          
          loggers:
            app:
              level: INFO
              handlers: [console, file]
              propagate: no
          
          root:
            level: WARNING
            handlers: [console]
          EOF
          
          echo "✓ Configuration files generated"

      - name: Generate Utility Scripts
        working-directory: ./repo
        run: |
          # Deploy script
          cat > here-files/scripts/deploy.sh <<'EOF'
          #!/bin/bash
          # Deployment script
          
          set -euo pipefail
          
          RED='\033[0;31m'
          GREEN='\033[0;32m'
          YELLOW='\033[1;33m'
          NC='\033[0m'
          
          log_info() { echo -e "${GREEN}[INFO]${NC} $*"; }
          log_warn() { echo -e "${YELLOW}[WARN]${NC} $*"; }
          log_error() { echo -e "${RED}[ERROR]${NC} $*" >&2; }
          
          check_requirements() {
              log_info "Checking requirements..."
              
              command -v docker >/dev/null 2>&1 || {
                  log_error "Docker not found"
                  exit 1
              }
              
              command -v git >/dev/null 2>&1 || {
                  log_error "Git not found"
                  exit 1
              }
              
              log_info "✓ All requirements met"
          }
          
          deploy() {
              local env=${1:-production}
              
              log_info "Deploying to: $env"
              
              # Build
              log_info "Building application..."
              docker build -t myapp:latest .
              
              # Test
              log_info "Running tests..."
              docker run --rm myapp:latest npm test
              
              # Deploy
              log_info "Deploying..."
              # Add actual deployment commands here
              
              log_info "✓ Deployment complete"
          }
          
          main() {
              check_requirements
              deploy "$@"
          }
          
          main "$@"
          EOF
          
          # Backup script
          cat > here-files/scripts/backup.sh <<'EOF'
          #!/bin/bash
          # Database backup script
          
          set -euo pipefail
          
          BACKUP_DIR="/backups"
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          
          backup_database() {
              local db_name=$1
              local backup_file="${BACKUP_DIR}/${db_name}_${TIMESTAMP}.sql.gz"
              
              echo "Backing up database: $db_name"
              
              pg_dump "$db_name" | gzip > "$backup_file"
              
              echo "✓ Backup saved: $backup_file"
          }
          
          cleanup_old_backups() {
              echo "Cleaning up backups older than 7 days..."
              find "$BACKUP_DIR" -name "*.sql.gz" -mtime +7 -delete
              echo "✓ Cleanup complete"
          }
          
          main() {
              mkdir -p "$BACKUP_DIR"
              backup_database "${DB_NAME:-mydb}"
              cleanup_old_backups
          }
          
          main
          EOF
          
          # Health check script
          cat > here-files/scripts/health-check.sh <<'EOF'
          #!/bin/bash
          # Health check script
          
          set -euo pipefail
          
          check_http() {
              local url=$1
              local status
              
              status=$(curl -s -o /dev/null -w "%{http_code}" "$url" || echo "000")
              
              if [ "$status" = "200" ]; then
                  echo "✓ HTTP check passed: $url"
                  return 0
              else
                  echo "✗ HTTP check failed: $url (status: $status)"
                  return 1
              fi
          }
          
          check_port() {
              local host=$1
              local port=$2
              
              if timeout 3 bash -c "cat < /dev/null > /dev/tcp/$host/$port" 2>/dev/null; then
                  echo "✓ Port check passed: $host:$port"
                  return 0
              else
                  echo "✗ Port check failed: $host:$port"
                  return 1
              fi
          }
          
          main() {
              local failed=0
              
              check_http "${APP_URL:-http://localhost:3000/health}" || ((failed++))
              check_port "${DB_HOST:-localhost}" "${DB_PORT:-5432}" || ((failed++))
              check_port "${REDIS_HOST:-localhost}" "${REDIS_PORT:-6379}" || ((failed++))
              
              if [ $failed -eq 0 ]; then
                  echo ""
                  echo "✓ All health checks passed"
                  exit 0
              else
                  echo ""
                  echo "✗ $failed health check(s) failed"
                  exit 1
              fi
          }
          
          main
          EOF
          
          # Make scripts executable
          chmod +x here-files/scripts/*.sh
          
          echo "✓ Utility scripts generated"

      - name: Generate Documentation
        working-directory: ./repo
        run: |
          # Main README
          cat > here-files/README.md <<'EOF'
          # Generated Files Directory
          
          This directory contains automatically generated configuration files, scripts, and documentation.
          
          ## Structure
          
          ```
          here-files/
          ├── configs/          # Configuration files
          │   ├── .env.template # Environment variables template
          │   ├── app-config.json
          │   └── logging.yml
          ├── scripts/          # Utility scripts
          │   ├── deploy.sh     # Deployment automation
          │   ├── backup.sh     # Database backups
          │   └── health-check.sh
          └── docs/            # Documentation
              ├── README.md     # This file
              └── USAGE.md      # Usage instructions
          ```
          
          ## Quick Start
          
          1. Copy configuration template:
             ```bash
             cp here-files/configs/.env.template .env
             ```
          
          2. Fill in environment variables in `.env`
          
          3. Run deployment:
             ```bash
             ./here-files/scripts/deploy.sh production
             ```
          
          ## Scripts
          
          - `deploy.sh` - Deploy application to specified environment
          - `backup.sh` - Create database backups
          - `health-check.sh` - Check service health
          
          ## Configuration
          
          - `app-config.json` - Application configuration
          - `logging.yml` - Logging configuration
          - `.env.template` - Environment variables template
          
          ## Maintenance
          
          These files are automatically generated. To update:
          
          1. Go to Actions tab
          2. Run "Cross-Repo File Generation" workflow
          3. Specify target repository
          4. Review and merge generated PR
          
          ## Support
          
          For issues or questions, create an issue in the repository.
          EOF
          
          # Usage documentation
          cat > here-files/docs/USAGE.md <<'EOF'
          # Usage Guide
          
          ## Configuration Setup
          
          ### Environment Variables
          
          1. Copy template:
             ```bash
             cp here-files/configs/.env.template .env
             ```
          
          2. Edit `.env` and fill in all required values
          
          3. Verify configuration:
             ```bash
             source .env
             echo $APP_NAME
             ```
          
          ### Application Config
          
          Edit `here-files/configs/app-config.json` to customize:
          
          - Server settings (port, host, timeout)
          - Database pool configuration
          - Cache settings
          - Logging preferences
          
          ## Running Scripts
          
          ### Deployment
          
          Deploy to staging:
          ```bash
          ./here-files/scripts/deploy.sh staging
          ```
          
          Deploy to production:
          ```bash
          ./here-files/scripts/deploy.sh production
          ```
          
          ### Backups
          
          Create backup:
          ```bash
          ./here-files/scripts/backup.sh
          ```
          
          Restore from backup:
          ```bash
          gunzip < backup.sql.gz | psql mydb
          ```
          
          ### Health Checks
          
          Run health checks:
          ```bash
          ./here-files/scripts/health-check.sh
          ```
          
          ## Troubleshooting
          
          ### Script Permission Errors
          
          If scripts aren't executable:
          ```bash
          chmod +x here-files/scripts/*.sh
          ```
          
          ### Configuration Issues
          
          Verify all required environment variables are set:
          ```bash
          env | grep -E '(APP_|DB_|REDIS_|API_)'
          ```
          
          ### Connection Problems
          
          Test connections manually:
          ```bash
          # Database
          psql -h $DB_HOST -p $DB_PORT -U $DB_USER $DB_NAME
          
          # Redis
          redis-cli -h $REDIS_HOST -p $REDIS_PORT ping
          ```
          
          ## Best Practices
          
          1. **Never commit** `.env` files with actual secrets
          2. **Always test** in staging before production
          3. **Regular backups** - run backup script daily
          4. **Monitor logs** - check application logs regularly
          5. **Health checks** - run before and after deployments
          
          ## Security
          
          - Keep secrets in environment variables
          - Use strong passwords
          - Rotate API keys regularly
          - Enable SSL/TLS for all connections
          - Keep dependencies updated
          
          ## Additional Resources
          
          - [Deployment Guide](https://docs.example.com/deploy)
          - [Backup Strategy](https://docs.example.com/backups)
          - [Monitoring Setup](https://docs.example.com/monitoring)
          EOF
          
          echo "✓ Documentation generated"

      - name: Commit Changes
        working-directory: ./repo
        run: |
          git add here-files/
          
          if git diff --staged --quiet; then
            echo "has_changes=false" >> $GITHUB_ENV
            exit 0
          fi
          
          cat > /tmp/commit-msg <<'EOF'
          Add generated files and configurations
          
          Generated comprehensive configuration and automation files:
          
          Configurations:
          - .env.template - Environment variables template
          - app-config.json - Application configuration
          - logging.yml - Logging configuration
          
          Scripts:
          - deploy.sh - Deployment automation
          - backup.sh - Database backup utility
          - health-check.sh - Service health checker
          
          Documentation:
          - README.md - Overview and quick start
          - USAGE.md - Detailed usage guide
          
          Generated by: github-actions[bot]
          Workflow: Cross-Repo File Generation
          Timestamp: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          EOF
          
          git commit -F /tmp/commit-msg
          echo "has_changes=true" >> $GITHUB_ENV
          echo "✓ Changes committed"

      - name: Push Branch
        if: env.has_changes == 'true'
        working-directory: ./repo
        run: |
          git push origin "${BRANCH_NAME}" --force
          echo "✓ Branch pushed"

      - name: Create Pull Request
        if: env.has_changes == 'true'
        working-directory: ./repo
        run: |
          # Create PR using gh CLI
          gh pr create \
            --title "Add auto-generated configuration and scripts" \
            --body "## Auto-Generated Files

          This PR adds automatically generated configuration files, utility scripts, and documentation.

          ### What's Included

          **Configuration Files** (\`configs/\`):
          - \`.env.template\` - Environment variables template
          - \`app-config.json\` - Application settings
          - \`logging.yml\` - Logging configuration

          **Utility Scripts** (\`scripts/\`):
          - \`deploy.sh\` - Deployment automation
          - \`backup.sh\` - Database backup utility
          - \`health-check.sh\` - Service health monitoring

          **Documentation** (\`docs/\`):
          - \`README.md\` - Overview and quick start
          - \`USAGE.md\` - Detailed usage instructions

          ### Quick Start

          After merging:
          \`\`\`bash
          # Setup configuration
          cp here-files/configs/.env.template .env
          # Edit .env with your values

          # Deploy
          ./here-files/scripts/deploy.sh production
          \`\`\`

          ### Generated By

          - Workflow: Cross-Repo File Generation
          - Branch: \`${BRANCH_NAME}\`
          - Generated: $(date -u +"%Y-%m-%d %H:%M:%S UTC")

          ---
          *Automatically generated by GitHub Actions* 🤖" \
            --base main \
            --head "${BRANCH_NAME}"
          
          echo "✓ Pull request created"
        env:
          GH_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}

      - name: Summary
        if: env.has_changes == 'true'
        run: |
          echo ""
          echo "═══════════════════════════════════════"
          echo "✓ Workflow Completed Successfully"
          echo "═══════════════════════════════════════"
          echo ""
          echo "Repository: ${TARGET_REPO}"
          echo "Branch: ${BRANCH_NAME}"
          echo "Files: Configuration, Scripts, Docs"
          echo ""
          echo "Pull request created and ready for review."
          echo ""
