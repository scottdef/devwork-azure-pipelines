name: Generate Files (Simple)

# Simpler version - generates files in current repo

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/generate-files-simple.yml'

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Directory
        run: mkdir -p here-files

      - name: Generate Files
        run: |
          # File 1: Configuration
          cat > here-files/config.sh <<'EOF'
          #!/bin/bash
          # Configuration file generated by GitHub Actions
          
          export APP_NAME="my-application"
          export APP_VERSION="1.0.0"
          export APP_ENV="production"
          export LOG_LEVEL="info"
          EOF
          
          # File 2: Data
          cat > here-files/data.txt <<'EOF'
          Sample Data File
          ================
          
          Line 1: Hello, World!
          Line 2: Generated by GitHub Actions
          Line 3: Timestamp: $(date)
          Line 4: End of file
          EOF
          
          # File 3: Template
          cat > here-files/template.html <<'EOF'
          <!DOCTYPE html>
          <html>
          <head>
              <title>Generated Page</title>
          </head>
          <body>
              <h1>Auto-Generated Page</h1>
              <p>This file was created by GitHub Actions.</p>
              <p>Generated: $(date)</p>
          </body>
          </html>
          EOF
          
          chmod +x here-files/config.sh

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add here-files/
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          
          git commit -m "Generate files in here-files/ [skip ci]"
          git push
