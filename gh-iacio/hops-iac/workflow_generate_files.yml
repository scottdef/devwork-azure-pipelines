name: Generate Files with HEREDOC

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: 'Target repository (owner/repo)'
        required: true
        type: string
        default: 'your-org/target-repo'
      branch_name:
        description: 'Branch name for changes'
        required: false
        type: string
        default: 'generated-files'
      pr_title:
        description: 'Pull request title'
        required: false
        type: string
        default: 'Add generated files'

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-and-commit:
    name: Generate Files and Create PR
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Target Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.target_repo }}
          token: ${{ secrets.GH_ADMIN_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create and Checkout Branch
        run: |
          BRANCH="${{ github.event.inputs.branch_name }}"
          
          # Delete branch if it exists (remote and local)
          git push origin --delete "$BRANCH" 2>/dev/null || true
          git branch -D "$BRANCH" 2>/dev/null || true
          
          # Create and checkout new branch
          git checkout -b "$BRANCH"
          
          echo "Created and checked out branch: $BRANCH"

      - name: Create here-files Directory
        run: |
          mkdir -p here-files
          echo "✓ Directory here-files created/verified"

      - name: Generate File 1 - README
        run: |
          cat > here-files/README.md <<'EOF'
          # Generated Files
          
          This directory contains files generated by GitHub Actions workflow.
          
          ## Contents
          
          - `README.md` - This file
          - `config.json` - Configuration file
          - `script.sh` - Example shell script
          - `template.yml` - YAML template
          - `Makefile` - Build automation
          
          ## Generated
          
          Generated on: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          Workflow: ${{ github.workflow }}
          Run ID: ${{ github.run_id }}
          
          ## Usage
          
          These files are maintained by automation. Manual edits may be overwritten.
          EOF
          
          echo "✓ Generated README.md"

      - name: Generate File 2 - JSON Config
        run: |
          cat > here-files/config.json <<'EOF'
          {
            "version": "1.0.0",
            "name": "generated-config",
            "description": "Configuration generated via GitHub Actions",
            "settings": {
              "environment": "production",
              "debug": false,
              "timeout": 30,
              "retries": 3
            },
            "features": {
              "feature_a": true,
              "feature_b": false,
              "feature_c": true
            },
            "endpoints": {
              "api": "https://api.example.com",
              "auth": "https://auth.example.com",
              "cdn": "https://cdn.example.com"
            },
            "metadata": {
              "generated_by": "github-actions",
              "workflow": "${{ github.workflow }}",
              "run_id": "${{ github.run_id }}",
              "timestamp": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
            }
          }
          EOF
          
          echo "✓ Generated config.json"

      - name: Generate File 3 - Shell Script
        run: |
          cat > here-files/script.sh <<'EOF'
          #!/bin/bash
          # Generated script - Example automation
          
          set -euo pipefail
          
          # Colors
          RED='\033[0;31m'
          GREEN='\033[0;32m'
          YELLOW='\033[1;33m'
          NC='\033[0m'
          
          info() { echo -e "${GREEN}[INFO]${NC} $*"; }
          warn() { echo -e "${YELLOW}[WARN]${NC} $*"; }
          error() { echo -e "${RED}[ERROR]${NC} $*" >&2; }
          
          # Main function
          main() {
              info "Starting script execution..."
              
              if [ $# -eq 0 ]; then
                  info "No arguments provided"
                  info "Usage: $0 [options]"
                  return 0
              fi
              
              for arg in "$@"; do
                  info "Processing: $arg"
              done
              
              info "Script completed successfully"
          }
          
          main "$@"
          EOF
          
          chmod +x here-files/script.sh
          echo "✓ Generated script.sh (executable)"

      - name: Generate File 4 - YAML Template
        run: |
          cat > here-files/template.yml <<'EOF'
          # YAML Template - Generated by GitHub Actions
          
          metadata:
            name: generated-template
            version: 1.0.0
            generated_at: "$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
            workflow:
              name: "${{ github.workflow }}"
              run_id: "${{ github.run_id }}"
              repository: "${{ github.event.inputs.target_repo }}"
          
          configuration:
            environment: production
            settings:
              - name: timeout
                value: 30
                unit: seconds
              - name: max_retries
                value: 3
                unit: attempts
              - name: batch_size
                value: 100
                unit: items
          
          resources:
            - type: service
              name: api-server
              replicas: 3
              image: nginx:latest
              
            - type: database
              name: primary-db
              replicas: 1
              image: postgres:15
              
            - type: cache
              name: redis-cache
              replicas: 2
              image: redis:7
          
          monitoring:
            enabled: true
            metrics:
              - cpu
              - memory
              - network
              - disk
            alerts:
              - name: high_cpu
                threshold: 80
                action: notify
              - name: low_memory
                threshold: 20
                action: scale_up
          EOF
          
          echo "✓ Generated template.yml"

      - name: Generate File 5 - Makefile
        run: |
          cat > here-files/Makefile <<'EOF'
          # Makefile - Generated by GitHub Actions
          # Simple, clean, Unix-style
          
          .PHONY: help all build test clean install run
          
          # Colors
          BOLD := \033[1m
          GREEN := \033[0;32m
          YELLOW := \033[1;33m
          NC := \033[0m
          
          help: ## Show this help message
          	@echo ""
          	@echo "$(BOLD)Available targets:$(NC)"
          	@echo ""
          	@grep -E '^[a-zA-Z_-]+:.*?## .*$$' $(MAKEFILE_LIST) | \
          		awk 'BEGIN {FS = ":.*?## "}; {printf "  $(GREEN)%-15s$(NC) %s\n", $$1, $$2}'
          	@echo ""
          
          all: build test ## Build and test
          
          build: ## Build the project
          	@echo "$(GREEN)Building...$(NC)"
          	@echo "Nothing to build yet"
          
          test: ## Run tests
          	@echo "$(GREEN)Running tests...$(NC)"
          	@./script.sh test
          
          clean: ## Clean build artifacts
          	@echo "$(YELLOW)Cleaning...$(NC)"
          	@rm -rf build/ dist/ *.log
          
          install: ## Install dependencies
          	@echo "$(GREEN)Installing...$(NC)"
          	@echo "No dependencies to install"
          
          run: ## Run the application
          	@echo "$(GREEN)Running...$(NC)"
          	@./script.sh run
          
          .DEFAULT_GOAL := help
          EOF
          
          echo "✓ Generated Makefile"

      - name: Generate File 6 - Documentation
        run: |
          cat > here-files/GENERATED.md <<'EOF'
          # Generated Files Documentation
          
          ## Overview
          
          This directory contains files automatically generated by GitHub Actions.
          
          **DO NOT EDIT MANUALLY** - Changes will be overwritten on next generation.
          
          ## Generation Details
          
          - **Workflow**: ${{ github.workflow }}
          - **Run ID**: ${{ github.run_id }}
          - **Repository**: ${{ github.event.inputs.target_repo }}
          - **Branch**: ${{ github.event.inputs.branch_name }}
          - **Generated**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          - **Generator**: github-actions[bot]
          
          ## Files Generated
          
          | File | Purpose | Format |
          |------|---------|--------|
          | README.md | Main documentation | Markdown |
          | config.json | Configuration | JSON |
          | script.sh | Example script | Bash |
          | template.yml | Template | YAML |
          | Makefile | Build automation | Makefile |
          | GENERATED.md | This file | Markdown |
          
          ## Regeneration
          
          To regenerate these files:
          
          1. Go to Actions tab in GitHub
          2. Select "Generate Files with HEREDOC" workflow
          3. Click "Run workflow"
          4. Fill in parameters:
             - Target repository
             - Branch name
             - PR title
          5. Review the generated PR
          
          ## Customization
          
          To customize generated files, edit the workflow at:
          `.github/workflows/generate-files.yml`
          
          Look for the "Generate File" steps and modify the HEREDOC content.
          
          ## Troubleshooting
          
          If generation fails:
          
          - Check workflow logs in Actions tab
          - Verify GH_ADMIN_TOKEN has correct permissions
          - Ensure target repository exists
          - Check branch doesn't have conflicts
          
          ## Support
          
          For issues or questions, create an issue in the repository.
          EOF
          
          echo "✓ Generated GENERATED.md"

      - name: Generate File 7 - Version Info
        run: |
          cat > here-files/VERSION <<'EOF'
          VERSION=1.0.0
          BUILD_NUMBER=${{ github.run_number }}
          COMMIT_SHA=${{ github.sha }}
          WORKFLOW=${{ github.workflow }}
          RUN_ID=${{ github.run_id }}
          GENERATED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          GENERATED_BY=github-actions
          EOF
          
          echo "✓ Generated VERSION"

      - name: List Generated Files
        run: |
          echo ""
          echo "════════════════════════════════════════"
          echo "Generated Files in here-files/"
          echo "════════════════════════════════════════"
          ls -lh here-files/
          echo ""
          echo "Total files: $(ls -1 here-files/ | wc -l)"
          echo "Total size: $(du -sh here-files/ | cut -f1)"
          echo ""

      - name: Add Files to Git
        run: |
          git add here-files/
          
          # Show what will be committed
          echo ""
          echo "════════════════════════════════════════"
          echo "Files to be committed:"
          echo "════════════════════════════════════════"
          git status --short
          echo ""

      - name: Commit Changes
        run: |
          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit"
            echo "has_changes=false" >> $GITHUB_ENV
            exit 0
          fi
          
          # Create commit message
          cat > /tmp/commit-msg <<'COMMIT_EOF'
          Add generated files to here-files/
          
          Generated files via GitHub Actions workflow.
          
          Workflow: ${{ github.workflow }}
          Run ID: ${{ github.run_id }}
          Repository: ${{ github.event.inputs.target_repo }}
          Branch: ${{ github.event.inputs.branch_name }}
          Generated: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          
          Files included:
          - README.md - Documentation
          - config.json - Configuration
          - script.sh - Example script
          - template.yml - YAML template
          - Makefile - Build automation
          - GENERATED.md - Generation docs
          - VERSION - Version info
          
          This commit was automatically generated.
          COMMIT_EOF
          
          # Commit
          git commit -F /tmp/commit-msg
          
          echo "has_changes=true" >> $GITHUB_ENV
          echo "✓ Changes committed"

      - name: Push Branch
        if: env.has_changes == 'true'
        run: |
          BRANCH="${{ github.event.inputs.branch_name }}"
          
          echo "Pushing branch: $BRANCH"
          git push origin "$BRANCH" --force
          
          echo "✓ Branch pushed successfully"

      - name: Create Pull Request
        if: env.has_changes == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_ADMIN_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const [owner, repo] = '${{ github.event.inputs.target_repo }}'.split('/');
            const branch = '${{ github.event.inputs.branch_name }}';
            const title = '${{ github.event.inputs.pr_title }}';
            
            try {
              // Check if PR already exists
              const { data: existingPRs } = await github.rest.pulls.list({
                owner,
                repo,
                head: `${owner}:${branch}`,
                state: 'open'
              });
              
              if (existingPRs.length > 0) {
                const pr = existingPRs[0];
                console.log(`PR already exists: #${pr.number}`);
                console.log(`URL: ${pr.html_url}`);
                
                // Update PR body
                await github.rest.pulls.update({
                  owner,
                  repo,
                  pull_number: pr.number,
                  body: `## Generated Files Update
            
            Files have been regenerated and updated in the \`here-files/\` directory.
            
            ### Generated Files
            
            - ✅ README.md - Documentation
            - ✅ config.json - Configuration
            - ✅ script.sh - Example shell script
            - ✅ template.yml - YAML template
            - ✅ Makefile - Build automation
            - ✅ GENERATED.md - Generation documentation
            - ✅ VERSION - Version information
            
            ### Details
            
            - **Workflow**: ${{ github.workflow }}
            - **Run ID**: [${{ github.run_id }}](${context.serverUrl}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            - **Branch**: \`${branch}\`
            - **Generated**: ${new Date().toISOString()}
            
            ### Changes
            
            All files in \`here-files/\` have been regenerated using HEREDOC scripts.
            
            ### Review Checklist
            
            - [ ] Review generated files for correctness
            - [ ] Verify no sensitive data is included
            - [ ] Check file permissions (script.sh should be executable)
            - [ ] Confirm documentation is accurate
            
            ### What's Next?
            
            1. Review the files in \`here-files/\`
            2. Approve this PR
            3. Merge to main
            
            ---
            
            *This PR was automatically generated by GitHub Actions* 🤖
            *To regenerate, run the workflow again*`
                });
                
                core.setOutput('pr_number', pr.number);
                core.setOutput('pr_url', pr.html_url);
                return;
              }
              
              // Create new PR
              const { data: pr } = await github.rest.pulls.create({
                owner,
                repo,
                title,
                head: branch,
                base: 'main',
                body: `## Generated Files
            
            This PR adds automatically generated files to the \`here-files/\` directory.
            
            ### Generated Files
            
            - ✅ README.md - Documentation
            - ✅ config.json - Configuration
            - ✅ script.sh - Example shell script (executable)
            - ✅ template.yml - YAML template
            - ✅ Makefile - Build automation
            - ✅ GENERATED.md - Generation documentation
            - ✅ VERSION - Version information
            
            ### Details
            
            - **Workflow**: ${{ github.workflow }}
            - **Run ID**: [${{ github.run_id }}](${context.serverUrl}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            - **Branch**: \`${branch}\`
            - **Generated**: ${new Date().toISOString()}
            
            ### What Are These Files?
            
            These files are generated using bash HEREDOC scripts in GitHub Actions.
            They demonstrate various file types and configurations that can be
            automatically created and maintained.
            
            ### Changes
            
            - Created \`here-files/\` directory
            - Generated 7 files with different formats (Markdown, JSON, YAML, Bash, Makefile)
            - Set proper permissions (script.sh is executable)
            
            ### Review Checklist
            
            - [ ] Review generated files for correctness
            - [ ] Verify no sensitive data is included
            - [ ] Check file permissions (script.sh should be executable)
            - [ ] Confirm documentation is accurate
            
            ### Testing
            
            You can test the generated files locally:
            
            \`\`\`bash
            # Clone and checkout this branch
            git checkout ${branch}
            
            # Navigate to directory
            cd here-files/
            
            # Test the script
            ./script.sh test
            
            # Use the Makefile
            make help
            make test
            \`\`\`
            
            ### What's Next?
            
            1. Review the files in \`here-files/\`
            2. Approve this PR
            3. Merge to main
            4. Files will be available in the repository
            
            ### Regeneration
            
            To regenerate these files, run the workflow again:
            - Go to Actions tab
            - Select "Generate Files with HEREDOC"
            - Click "Run workflow"
            
            ---
            
            *This PR was automatically generated by GitHub Actions* 🤖`
              });
              
              console.log(`✓ Pull request created: #${pr.number}`);
              console.log(`URL: ${pr.html_url}`);
              
              core.setOutput('pr_number', pr.number);
              core.setOutput('pr_url', pr.html_url);
              
            } catch (error) {
              core.setFailed(`Failed to create PR: ${error.message}`);
            }

      - name: Summary
        if: env.has_changes == 'true'
        run: |
          echo ""
          echo "════════════════════════════════════════"
          echo "✓ Workflow Completed Successfully"
          echo "════════════════════════════════════════"
          echo ""
          echo "Repository: ${{ github.event.inputs.target_repo }}"
          echo "Branch: ${{ github.event.inputs.branch_name }}"
          echo "Files generated: 7"
          echo ""
          echo "Pull request has been created."
          echo "Review and merge to apply changes."
          echo ""

      - name: No Changes
        if: env.has_changes == 'false'
        run: |
          echo ""
          echo "════════════════════════════════════════"
          echo "ℹ No Changes Detected"
          echo "════════════════════════════════════════"
          echo ""
          echo "Files already exist and are up to date."
          echo "No pull request created."
          echo ""
