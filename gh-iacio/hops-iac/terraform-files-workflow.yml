    - name: Generate Terraform scripts and utilities
      working-directory: target-repo/terraform/scripts
      run: |
        echo "Generating Terraform utility scripts..."
        
        # Generate terraform wrapper script
        cat << 'TERRAFORM_SCRIPT_EOF' > terraform.sh
        #!/bin/bash
        # Terraform wrapper script
        # Because automation should be simple and safe
        
        set -euo pipefail
        
        # Configuration
        TERRAFORM_VERSION="1.5.0"
        SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
        TERRAFORM_DIR="$(dirname "$SCRIPT_DIR")"
        
        # Colors for output
        RED='\033[0;31m'
        GREEN='\033[0;32m'
        YELLOW='\033[1;33m'
        NC='\033[0m' # No Color
        
        # Logging functions
        log_info() { echo -e "${GREEN}[INFO]${NC} $1"; }
        log_warn() { echo -e "${YELLOW}[WARN]${NC} $1"; }
        log_error() { echo -e "${RED}[ERROR]${NC} $1"; }
        
        # Usage function
        usage() {
          echo "Usage: $0 [command] [options]"
          echo ""
          echo "Commands:"
          echo "  init       Initialize Terraform"
          echo "  plan       Create execution plan"
          echo "  apply      Apply changes"
          echo "  destroy    Destroy infrastructure"
          echo "  validate   Validate configuration"
          echo "  fmt        Format configuration files"
          echo "  version    Show Terraform version"
          echo "  help       Show this help message"
          echo ""
          echo "Options:"
          echo "  -e ENV     Environment (dev, staging, prod)"
          echo "  -v         Verbose output"
          echo "  -h         Show help"
        }
        
        # Check if terraform is installed
        check_terraform() {
          if ! command -v terraform &> /dev/null; then
            log_error "Terraform is not installed or not in PATH"
            exit 1
          fi
          
          local version=$(terraform version -json | jq -r '.terraform_version')
          log_info "Using Terraform version: $version"
        }
        
        # Initialize Terraform
        terraform_init() {
          log_info "Initializing Terraform..."
          cd "$TERRAFORM_DIR"
          terraform init
          log_info "Terraform initialized successfully"
        }
        
        # Plan changes
        terraform_plan() {
          log_info "Creating Terraform plan..."
          cd "$TERRAFORM_DIR"
          terraform plan -out=tfplan
          log_info "Plan created successfully"
        }
        
        # Apply changes
        terraform_apply() {
          log_info "Applying Terraform changes..."
          cd "$TERRAFORM_DIR"
          
          if [[ -f "tfplan" ]]; then
            terraform apply tfplan
            rm -f tfplan
          else
            log_warn "No plan file found, running apply with auto-approve"
            terraform apply -auto-approve
          fi
          
          log_info "Apply completed successfully"
        }
        
        # Destroy infrastructure
        terraform_destroy() {
          log_warn "This will destroy all infrastructure!"
          read -p "Are you sure? (yes/no): " confirm
          
          if [[ "$confirm" == "yes" ]]; then
            log_info "Destroying infrastructure..."
            cd "$TERRAFORM_DIR"
            terraform destroy -auto-approve
            log_info "Infrastructure destroyed"
          else
            log_info "Destroy cancelled"
          fi
        }
        
        # Validate configuration
        terraform_validate() {
          log_info "Validating Terraform configuration..."
          cd "$TERRAFORM_DIR"
          terraform validate
          log_info "Configuration is valid"
        }
        
        # Format files
        terraform_fmt() {
          log_info "Formatting Terraform files..."
          cd "$TERRAFORM_DIR"
          terraform fmt -recursive
          log_info "Files formatted successfully"
        }
        
        # Main execution
        main() {
          check_terraform
          
          case "${1:-help}" in
            init)
              terraform_init
              ;;
            plan)
              terraform_plan
              ;;
            apply)
              terraform_apply
              ;;
            destroy)
              terraform_destroy
              ;;
            validate)
              terraform_validate
              ;;
            fmt|format)
              terraform_fmt
              ;;
            version)
              terraform version
              ;;
            help|--help|-h)
              usage
              ;;
            *)
              log_error "Unknown command: $1"
              usage
              exit 1
              ;;
          esac
        }
        
        # Run main function with all arguments
        main "$@"
        TERRAFORM_SCRIPT_EOF
        
        chmod +x terraform.sh
        
        # Generate pre-commit script
        cat << 'PRECOMMIT_EOF' > pre-commit.sh
        #!/bin/bash
        # Pre-commit hook for Terraform
        # Ensures code quality before commits
        
        set -e
        
        echo "Running Terraform pre-commit checks..."
        
        # Format check
        echo "Checking Terraform formatting..."
        if ! terraform fmt -check=true -diff=true; then
          echo "❌ Terraform files are not formatted properly"
          echo "Run 'terraform fmt' to fix formatting issues"
          exit 1
        fi
        echo "✅ Terraform formatting check passed"
        
        # Validation check
        echo "Validating Terraform configuration..."
        if ! terraform validate; then
          echo "❌ Terraform validation failed"
          exit 1
        fi
        echo "✅ Terraform validation passed"
        
        # Security scan (if tfsec is available)
        if command -v tfsec &> /dev/null; then
          echo "Running security scan..."
          tfsec .
          echo "✅ Security scan completed"
        else
          echo "⚠️  tfsec not found, skipping security scan"
        fi
        
        echo "🎉 All pre-commit checks passed!"
        PRECOMMIT_EOF
        
        chmod +x pre-commit.sh
        
        echo "✓ Terraform utility scripts generated"

    - name: Generate comprehensive README
