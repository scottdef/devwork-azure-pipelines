name: Terraform Files Generator
on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: 'Target repository (owner/repo-name)'
        required: true
        type: string
      branch_name:
        description: 'Branch name for changes'
        required: false
        default: 'feature/terraform-infrastructure'
        type: string
      commit_message:
        description: 'Commit message'
        required: false
        default: 'Generate Terraform infrastructure with heredoc automation'
        type: string
      cloud_provider:
        description: 'Cloud provider (aws, azure, gcp, multi)'
        required: false
        default: 'aws'
        type: choice
        options:
        - aws
        - azure
        - gcp
        - multi
      environment:
        description: 'Target environment'
        required: false
        default: 'dev'
        type: choice
        options:
        - dev
        - staging
        - prod

env:
  TARGET_REPO: ${{ inputs.target_repo }}
  BRANCH_NAME: ${{ inputs.branch_name }}
  COMMIT_MSG: ${{ inputs.commit_message }}
  CLOUD_PROVIDER: ${{ inputs.cloud_provider }}
  ENVIRONMENT: ${{ inputs.environment }}

jobs:
  generate-terraform-files:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    
    steps:
    - name: Validate inputs and setup
      run: |
        if [[ -z "$TARGET_REPO" ]]; then
          echo "Error: target_repo is required"
          exit 1
        fi
        if [[ ! "$TARGET_REPO" =~ ^[a-zA-Z0-9_.-]+/[a-zA-Z0-9_.-]+$ ]]; then
          echo "Error: target_repo must be in format 'owner/repo-name'"
          exit 1
        fi
        echo "✓ Target repo: $TARGET_REPO"
        echo "✓ Branch: $BRANCH_NAME"
        echo "✓ Cloud provider: $CLOUD_PROVIDER"
        echo "✓ Environment: $ENVIRONMENT"

    - name: Generate GitHub token for target repo
      id: app_token
      uses: actions/create-github-app-token@v1
      with:
        app-id: ${{ vars.APP_ID }}
        private-key: ${{ secrets.APP_PRIVATE_KEY }}
        owner: ${{ split(env.TARGET_REPO, '/')[0] }}

    - name: Clone target repository
      run: |
        echo "Cloning $TARGET_REPO..."
        git clone "https://x-access-token:${{ steps.app_token.outputs.token }}@github.com/$TARGET_REPO.git" target-repo
        cd target-repo
        
        # Set git config for commits
        git config user.name "terraform-bot[bot]"
        git config user.email "terraform-bot[bot]@users.noreply.github.com"
        
        echo "Repository cloned successfully:"
        pwd
        ls -la

    - name: Create and switch to feature branch
      working-directory: target-repo
      run: |
        echo "Creating branch: $BRANCH_NAME"
        git checkout -b "$BRANCH_NAME"
        git branch -v

    - name: Ensure terraform directory structure exists
      working-directory: target-repo
      run: |
        echo "Creating Terraform directory structure..."
        mkdir -p terraform/{environments/$ENVIRONMENT,modules/{compute,network,storage,security},scripts}
        
        echo "✓ Directory structure created:"
        find terraform -type d | sort

    - name: Generate core Terraform configuration files
      working-directory: target-repo/terraform
      run: |
        echo "Generating core Terraform files with heredoc magic..."
        
        # Generate versions.tf - version constraints are critical
        cat << 'VERSIONS_EOF' > versions.tf
        # Terraform version constraints
        # Always pin your versions in production
        
        terraform {
          required_version = ">= 1.5.0"
          
          required_providers {
            aws = {
              source  = "hashicorp/aws"
              version = "~> 5.0"
            }
            azurerm = {
              source  = "hashicorp/azurerm"
              version = "~> 3.0"
            }
            google = {
              source  = "hashicorp/google"
              version = "~> 4.0"
            }
            random = {
              source  = "hashicorp/random"
              version = "~> 3.1"
            }
            tls = {
              source  = "hashicorp/tls"
              version = "~> 4.0"
            }
          }
          
          # Backend configuration - uncomment and configure as needed
          # backend "s3" {
          #   bucket = "your-terraform-state-bucket"
          #   key    = "infrastructure/terraform.tfstate"
          #   region = "us-west-2"
          # }
        }
        VERSIONS_EOF
        
        # Generate main.tf based on cloud provider
        if [[ "$CLOUD_PROVIDER" == "aws" || "$CLOUD_PROVIDER" == "multi" ]]; then
          cat << 'AWS_MAIN_EOF' > main.tf
        # Main Terraform configuration for AWS infrastructure
        # Following the Unix philosophy: simple, composable, effective
        
        # Configure the AWS Provider
        provider "aws" {
          region = var.aws_region
          
          default_tags {
            tags = {
              Environment   = var.environment
              Project       = var.project_name
              ManagedBy     = "terraform"
              CreatedBy     = "heredoc-automation"
              Owner         = var.owner
            }
          }
        }
        
        # Data sources for existing resources
        data "aws_availability_zones" "available" {
          state = "available"
        }
        
        data "aws_caller_identity" "current" {}
        
        data "aws_region" "current" {}
        
        # Random suffix for unique resource names
        resource "random_id" "suffix" {
          byte_length = 4
        }
        
        # Local values for computed configurations
        locals {
          name_prefix = "${var.project_name}-${var.environment}"
          common_tags = {
            Environment = var.environment
            Project     = var.project_name
            ManagedBy   = "terraform"
            Owner       = var.owner
          }
          
          # Availability zone selection
          azs = slice(data.aws_availability_zones.available.names, 0, min(length(data.aws_availability_zones.available.names), 3))
        }
        
        # VPC Module
        module "vpc" {
          source = "./modules/network"
          
          name_prefix        = local.name_prefix
          vpc_cidr          = var.vpc_cidr
          availability_zones = local.azs
          environment       = var.environment
          
          tags = local.common_tags
        }
        
        # Security Module
        module "security" {
          source = "./modules/security"
          
          name_prefix = local.name_prefix
          vpc_id      = module.vpc.vpc_id
          environment = var.environment
          
          tags = local.common_tags
        }
        
        # Compute Module
        module "compute" {
          source = "./modules/compute"
          
          name_prefix           = local.name_prefix
          vpc_id               = module.vpc.vpc_id
          private_subnet_ids   = module.vpc.private_subnet_ids
          security_group_ids   = [module.security.web_security_group_id]
          environment          = var.environment
          instance_type        = var.instance_type
          
          tags = local.common_tags
        }
        AWS_MAIN_EOF
        
        elif [[ "$CLOUD_PROVIDER" == "azure" ]]; then
          cat << 'AZURE_MAIN_EOF' > main.tf
        # Main Terraform configuration for Azure infrastructure
        
        # Configure the Azure Provider
        provider "azurerm" {
          features {
            resource_group {
              prevent_deletion_if_contains_resources = false
            }
          }
        }
        
        # Random suffix for unique resource names
        resource "random_id" "suffix" {
          byte_length = 4
        }
        
        # Local values
        locals {
          name_prefix = "${var.project_name}-${var.environment}"
          location    = var.azure_location
          
          common_tags = {
            Environment = var.environment
            Project     = var.project_name
            ManagedBy   = "terraform"
            Owner       = var.owner
          }
        }
        
        # Resource Group
        resource "azurerm_resource_group" "main" {
          name     = "${local.name_prefix}-rg-${random_id.suffix.hex}"
          location = local.location
          
          tags = local.common_tags
        }
        
        # Network Module
        module "network" {
          source = "./modules/network"
          
          resource_group_name = azurerm_resource_group.main.name
          location           = azurerm_resource_group.main.location
          name_prefix        = local.name_prefix
          environment        = var.environment
          
          tags = local.common_tags
        }
        AZURE_MAIN_EOF
        
        elif [[ "$CLOUD_PROVIDER" == "gcp" ]]; then
          cat << 'GCP_MAIN_EOF' > main.tf
        # Main Terraform configuration for Google Cloud Platform
        
        # Configure the Google Cloud Provider
        provider "google" {
          project = var.gcp_project_id
          region  = var.gcp_region
        }
        
        # Random suffix for unique resource names
        resource "random_id" "suffix" {
          byte_length = 4
        }
        
        # Local values
        locals {
          name_prefix = "${var.project_name}-${var.environment}"
          
          common_labels = {
            environment = var.environment
            project     = var.project_name
            managed_by  = "terraform"
            owner       = var.owner
          }
        }
        
        # Network Module
        module "network" {
          source = "./modules/network"
          
          project_id   = var.gcp_project_id
          name_prefix  = local.name_prefix
          region       = var.gcp_region
          environment  = var.environment
          
          labels = local.common_labels
        }
        GCP_MAIN_EOF
        fi
        
        echo "✓ Main configuration generated for $CLOUD_PROVIDER"

    - name: Generate variables configuration
      working-directory: target-repo/terraform
      run: |
        echo "Generating variables.tf..."
        
        cat << 'VARIABLES_EOF' > variables.tf
        # Terraform Variables Definition
        # Following the principle of explicit configuration
        
        # Project Configuration
        variable "project_name" {
          description = "Name of the project"
          type        = string
          default     = "terraform-project"
          
          validation {
            condition     = can(regex("^[a-z0-9-]+$", var.project_name))
            error_message = "Project name must contain only lowercase letters, numbers, and hyphens."
          }
        }
        
        variable "environment" {
          description = "Environment name (dev, staging, prod)"
          type        = string
          default     = "dev"
          
          validation {
            condition     = contains(["dev", "staging", "prod"], var.environment)
            error_message = "Environment must be one of: dev, staging, prod."
          }
        }
        
        variable "owner" {
          description = "Owner/team responsible for the infrastructure"
          type        = string
          default     = "platform-team"
        }
        VARIABLES_EOF
        
        # Add cloud-specific variables
        if [[ "$CLOUD_PROVIDER" == "aws" || "$CLOUD_PROVIDER" == "multi" ]]; then
          cat << 'AWS_VARS_EOF' >> variables.tf
        
        # AWS-specific variables
        variable "aws_region" {
          description = "AWS region for resources"
          type        = string
          default     = "us-west-2"
        }
        
        variable "vpc_cidr" {
          description = "CIDR block for VPC"
          type        = string
          default     = "10.0.0.0/16"
          
          validation {
            condition     = can(cidrhost(var.vpc_cidr, 0))
            error_message = "VPC CIDR must be a valid IPv4 CIDR block."
          }
        }
        
        variable "instance_type" {
          description = "EC2 instance type"
          type        = string
          default     = "t3.micro"
        }
        AWS_VARS_EOF
        fi
        
        if [[ "$CLOUD_PROVIDER" == "azure" ]]; then
          cat << 'AZURE_VARS_EOF' >> variables.tf
        
        # Azure-specific variables
        variable "azure_location" {
          description = "Azure region for resources"
          type        = string
          default     = "East US"
        }
        
        variable "vm_size" {
          description = "Azure VM size"
          type        = string
          default     = "Standard_B1s"
        }
        AZURE_VARS_EOF
        fi
        
        if [[ "$CLOUD_PROVIDER" == "gcp" ]]; then
          cat << 'GCP_VARS_EOF' >> variables.tf
        
        # GCP-specific variables
        variable "gcp_project_id" {
          description = "Google Cloud Project ID"
          type        = string
        }
        
        variable "gcp_region" {
          description = "Google Cloud region"
          type        = string
          default     = "us-central1"
        }
        
        variable "machine_type" {
          description = "GCP machine type"
          type        = string
          default     = "e2-micro"
        }
        GCP_VARS_EOF
        fi
        
        echo "✓ Variables configuration generated"

    - name: Generate outputs configuration
      working-directory: target-repo/terraform
      run: |
        echo "Generating outputs.tf..."
        
        cat << 'OUTPUTS_EOF' > outputs.tf
        # Terraform Outputs
        # Information that should be easily accessible after deployment
        
        output "project_info" {
          description = "Project information"
          value = {
            name        = var.project_name
            environment = var.environment
            owner       = var.owner
          }
        }
        
        output "deployment_info" {
          description = "Deployment metadata"
          value = {
            terraform_version = terraform.version
            deployed_at      = timestamp()
            random_suffix    = random_id.suffix.hex
          }
        }
        OUTPUTS_EOF
        
        # Add cloud-specific outputs
        if [[ "$CLOUD_PROVIDER" == "aws" || "$CLOUD_PROVIDER" == "multi" ]]; then
          cat << 'AWS_OUTPUTS_EOF' >> outputs.tf
        
        # AWS-specific outputs
        output "aws_info" {
          description = "AWS deployment information"
          value = {
            region     = data.aws_region.current.name
            account_id = data.aws_caller_identity.current.account_id
            vpc_id     = module.vpc.vpc_id
            vpc_cidr   = module.vpc.vpc_cidr
          }
        }
        
        output "network_info" {
          description = "Network configuration details"
          value = {
            vpc_id             = module.vpc.vpc_id
            public_subnet_ids  = module.vpc.public_subnet_ids
            private_subnet_ids = module.vpc.private_subnet_ids
            availability_zones = local.azs
          }
        }
        AWS_OUTPUTS_EOF
        fi
        
        echo "✓ Outputs configuration generated"

    - name: Generate example tfvars file
      working-directory: target-repo/terraform
      run: |
        echo "Generating terraform.tfvars.example..."
        
        cat << 'TFVARS_EOF' > terraform.tfvars.example
        # Terraform Variables Example
        # Copy this file to terraform.tfvars and customize for your environment
        # DO NOT commit terraform.tfvars to version control if it contains secrets
        
        # Project Configuration
        project_name = "my-awesome-project"
        environment  = "dev"
        owner        = "platform-team"
        TFVARS_EOF
        
        # Add cloud-specific examples
        if [[ "$CLOUD_PROVIDER" == "aws" || "$CLOUD_PROVIDER" == "multi" ]]; then
          cat << 'AWS_TFVARS_EOF' >> terraform.tfvars.example
        
        # AWS Configuration
        aws_region    = "us-west-2"
        vpc_cidr      = "10.0.0.0/16"
        instance_type = "t3.micro"
        AWS_TFVARS_EOF
        fi
        
        if [[ "$CLOUD_PROVIDER" == "azure" ]]; then
          cat << 'AZURE_TFVARS_EOF' >> terraform.tfvars.example
        
        # Azure Configuration
        azure_location = "East US"
        vm_size        = "Standard_B1s"
        AZURE_TFVARS_EOF
        fi
        
        if [[ "$CLOUD_PROVIDER" == "gcp" ]]; then
          cat << 'GCP_TFVARS_EOF' >> terraform.tfvars.example
        
        # GCP Configuration
        gcp_project_id = "my-gcp-project-123456"
        gcp_region     = "us-central1"
        machine_type   = "e2-micro"
        GCP_TFVARS_EOF
        fi
        
        echo "✓ Example tfvars file generated"

    - name: Generate network module
      working-directory: target-repo/terraform/modules/network
      run: |
        echo "Generating network module..."
        
        if [[ "$CLOUD_PROVIDER" == "aws" || "$CLOUD_PROVIDER" == "multi" ]]; then
          cat << 'NETWORK_MAIN_EOF' > main.tf
        # Network Module - AWS VPC and Subnets
        # Following AWS best practices for network architecture
        
        # VPC
        resource "aws_vpc" "main" {
          cidr_block           = var.vpc_cidr
          enable_dns_hostnames = true
          enable_dns_support   = true
          
          tags = merge(var.tags, {
            Name = "${var.name_prefix}-vpc"
          })
        }
        
        # Internet Gateway
        resource "aws_internet_gateway" "main" {
          vpc_id = aws_vpc.main.id
          
          tags = merge(var.tags, {
            Name = "${var.name_prefix}-igw"
          })
        }
        
        # Public Subnets
        resource "aws_subnet" "public" {
          count = length(var.availability_zones)
          
          vpc_id                  = aws_vpc.main.id
          cidr_block              = cidrsubnet(var.vpc_cidr, 8, count.index)
          availability_zone       = var.availability_zones[count.index]
          map_public_ip_on_launch = true
          
          tags = merge(var.tags, {
            Name = "${var.name_prefix}-public-${var.availability_zones[count.index]}"
            Type = "public"
          })
        }
        
        # Private Subnets
        resource "aws_subnet" "private" {
          count = length(var.availability_zones)
          
          vpc_id            = aws_vpc.main.id
          cidr_block        = cidrsubnet(var.vpc_cidr, 8, count.index + 10)
          availability_zone = var.availability_zones[count.index]
          
          tags = merge(var.tags, {
            Name = "${var.name_prefix}-private-${var.availability_zones[count.index]}"
            Type = "private"
          })
        }
        
        # Elastic IPs for NAT Gateways
        resource "aws_eip" "nat" {
          count = length(var.availability_zones)
          
          domain = "vpc"
          
          tags = merge(var.tags, {
            Name = "${var.name_prefix}-nat-eip-${count.index + 1}"
          })
          
          depends_on = [aws_internet_gateway.main]
        }
        
        # NAT Gateways
        resource "aws_nat_gateway" "main" {
          count = length(var.availability_zones)
          
          allocation_id = aws_eip.nat[count.index].id
          subnet_id     = aws_subnet.public[count.index].id
          
          tags = merge(var.tags, {
            Name = "${var.name_prefix}-nat-${count.index + 1}"
          })
          
          depends_on = [aws_internet_gateway.main]
        }
        
        # Route Table - Public
        resource "aws_route_table" "public" {
          vpc_id = aws_vpc.main.id
          
          route {
            cidr_block = "0.0.0.0/0"
            gateway_id = aws_internet_gateway.main.id
          }
          
          tags = merge(var.tags, {
            Name = "${var.name_prefix}-public-rt"
          })
        }
        
        # Route Table - Private
        resource "aws_route_table" "private" {
          count = length(var.availability_zones)
          
          vpc_id = aws_vpc.main.id
          
          route {
            cidr_block     = "0.0.0.0/0"
            nat_gateway_id = aws_nat_gateway.main[count.index].id
          }
          
          tags = merge(var.tags, {
            Name = "${var.name_prefix}-private-rt-${count.index + 1}"
          })
        }
        
        # Route Table Associations - Public
        resource "aws_route_table_association" "public" {
          count = length(aws_subnet.public)
          
          subnet_id      = aws_subnet.public[count.index].id
          route_table_id = aws_route_table.public.id
        }
        
        # Route Table Associations - Private
        resource "aws_route_table_association" "private" {
          count = length(aws_subnet.private)
          
          subnet_id      = aws_subnet.private[count.index].id
          route_table_id = aws_route_table.private[count.index].id
        }
        NETWORK_MAIN_EOF
        
          cat << 'NETWORK_VARS_EOF' > variables.tf
        variable "name_prefix" {
          description = "Prefix for resource names"
          type        = string
        }
        
        variable "vpc_cidr" {
          description = "CIDR block for VPC"
          type        = string
        }
        
        variable "availability_zones" {
          description = "List of availability zones"
          type        = list(string)
        }
        
        variable "environment" {
          description = "Environment name"
          type        = string
        }
        
        variable "tags" {
          description = "Common tags to apply to resources"
          type        = map(string)
          default     = {}
        }
        NETWORK_VARS_EOF
        
          cat << 'NETWORK_OUTPUTS_EOF' > outputs.tf
        output "vpc_id" {
          description = "ID of the VPC"
          value       = aws_vpc.main.id
        }
        
        output "vpc_cidr" {
          description = "CIDR block of the VPC"
          value       = aws_vpc.main.cidr_block
        }
        
        output "public_subnet_ids" {
          description = "List of public subnet IDs"
          value       = aws_subnet.public[*].id
        }
        
        output "private_subnet_ids" {
          description = "List of private subnet IDs"
          value       = aws_subnet.private[*].id
        }
        
        output "internet_gateway_id" {
          description = "ID of the Internet Gateway"
          value       = aws_internet_gateway.main.id
        }
        
        output "nat_gateway_ids" {
          description = "List of NAT Gateway IDs"
          value       = aws_nat_gateway.main[*].id
        }
        NETWORK_OUTPUTS_EOF
        fi
        
        echo "✓ Network module generated"

    - name: Generate security module
      working-directory: target-repo/terraform/modules/security
      run: |
        echo "Generating security module..."
        
        if [[ "$CLOUD_PROVIDER" == "aws" || "$CLOUD_PROVIDER" == "multi" ]]; then
          cat << 'SECURITY_MAIN_EOF' > main.tf
        # Security Module - Security Groups and NACLs
        # Defense in depth - multiple layers of security
        
        # Web Security Group
        resource "aws_security_group" "web" {
          name_prefix = "${var.name_prefix}-web-"
          vpc_id      = var.vpc_id
          description = "Security group for web servers"
          
          # HTTP from anywhere
          ingress {
            description = "HTTP"
            from_port   = 80
            to_port     = 80
            protocol    = "tcp"
            cidr_blocks = ["0.0.0.0/0"]
          }
          
          # HTTPS from anywhere
          ingress {
            description = "HTTPS"
            from_port   = 443
            to_port     = 443
            protocol    = "tcp"
            cidr_blocks = ["0.0.0.0/0"]
          }
          
          # SSH from management subnet only (example)
          ingress {
            description = "SSH"
            from_port   = 22
            to_port     = 22
            protocol    = "tcp"
            cidr_blocks = ["10.0.0.0/24"] # Restrict as needed
          }
          
          # All outbound traffic
          egress {
            description = "All outbound"
            from_port   = 0
            to_port     = 0
            protocol    = "-1"
            cidr_blocks = ["0.0.0.0/0"]
          }
          
          tags = merge(var.tags, {
            Name = "${var.name_prefix}-web-sg"
            Type = "web"
          })
          
          lifecycle {
            create_before_destroy = true
          }
        }
        
        # Database Security Group
        resource "aws_security_group" "database" {
          name_prefix = "${var.name_prefix}-db-"
          vpc_id      = var.vpc_id
          description = "Security group for database servers"
          
          # MySQL/Aurora from web security group
          ingress {
            description     = "MySQL/Aurora"
            from_port       = 3306
            to_port         = 3306
            protocol        = "tcp"
            security_groups = [aws_security_group.web.id]
          }
          
          # PostgreSQL from web security group
          ingress {
            description     = "PostgreSQL"
            from_port       = 5432
            to_port         = 5432
            protocol        = "tcp"
            security_groups = [aws_security_group.web.id]
          }
          
          tags = merge(var.tags, {
            Name = "${var.name_prefix}-db-sg"
            Type = "database"
          })
          
          lifecycle {
            create_before_destroy = true
          }
        }
        
        # Application Load Balancer Security Group
        resource "aws_security_group" "alb" {
          name_prefix = "${var.name_prefix}-alb-"
          vpc_id      = var.vpc_id
          description = "Security group for Application Load Balancer"
          
          # HTTP from anywhere
          ingress {
            description = "HTTP"
            from_port   = 80
            to_port     = 80
            protocol    = "tcp"
            cidr_blocks = ["0.0.0.0/0"]
          }
          
          # HTTPS from anywhere
          ingress {
            description = "HTTPS"
            from_port   = 443
            to_port     = 443
            protocol    = "tcp"
            cidr_blocks = ["0.0.0.0/0"]
          }
          
          # All outbound traffic
          egress {
            description = "All outbound"
            from_port   = 0
            to_port     = 0
