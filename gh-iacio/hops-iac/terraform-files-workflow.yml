          cat << 'COMPUTE_MAIN_EOF' > main.tf
        # Compute Module - EC2 instances and Auto Scaling
        # Scalable, resilient compute infrastructure
        
        # Data source for latest Amazon Linux 2 AMI
        data "aws_ami" "amazon_linux" {
          most_recent = true
          owners      = ["amazon"]
          
          filter {
            name   = "name"
            values = ["amzn2-ami-hvm-*-x86_64-gp2"]
          }
          
          filter {
            name   = "virtualization-type"
            values = ["hvm"]
          }
        }
        
        # Launch template for Auto Scaling Group
        resource "aws_launch_template" "web" {
          name_prefix   = "${var.name_prefix}-web-"
          image_id      = data.aws_ami.amazon_linux.id
          instance_type = var.instance_type
          
          vpc_security_group_ids = var.security_group_ids
          
          user_data = base64encode(templatefile("${path.module}/user_data.sh", {
            environment = var.environment
            app_name    = var.name_prefix
          }))
          
          tag_specifications {
            resource_type = "instance"
            tags = merge(var.tags, {
              Name = "${var.name_prefix}-web-instance"
              Type = "web-server"
            })
          }
          
          lifecycle {
            create_before_destroy = true
          }
        }
        
        # Auto Scaling Group
        resource "aws_autoscaling_group" "web" {
          name                = "${var.name_prefix}-web-asg"
          vpc_zone_identifier = var.private_subnet_ids
          target_group_arns   = var.target_group_arns
          health_check_type   = "ELB"
          health_check_grace_period = 300
          
          min_size         = var.min_size
          max_size         = var.max_size
          desired_capacity = var.desired_capacity
          
          launch_template {
            id      = aws_launch_template.web.id
            version = "$Latest"
          }
          
          dynamic "tag" {
            for_each = var.tags
            content {
              key                 = tag.key
              value               = tag.value
              propagate_at_launch = true
            }
          }
          
          tag {
            key                 = "Name"
            value               = "${var.name_prefix}-web-asg"
            propagate_at_launch = false
          }
          
          lifecycle {
            create_before_destroy = true
          }
        }
        
        # Auto Scaling Policies
        resource "aws_autoscaling_policy" "scale_up" {
          name                   = "${var.name_prefix}-scale-up"
          scaling_adjustment     = 1
          adjustment_type        = "ChangeInCapacity"
          cooldown              = 300
          autoscaling_group_name = aws_autoscaling_group.web.name
        }
        
        resource "aws_autoscaling_policy" "scale_down" {
          name                   = "${var.name_prefix}-scale-down"
          scaling_adjustment     = -1
          adjustment_type        = "ChangeInCapacity"
          cooldown              = 300
          autoscaling_group_name = aws_autoscaling_group.web.name
        }
        
        # CloudWatch Alarms
        resource "aws_cloudwatch_metric_alarm" "cpu_high" {
          alarm_name          = "${var.name_prefix}-cpu-high"
          comparison_operator = "GreaterThanThreshold"
          evaluation_periods  = "2"
          metric_name         = "CPUUtilization"
          namespace           = "AWS/EC2"
          period              = "300"
          statistic           = "Average"
          threshold           = "80"
          alarm_description   = "This metric monitors ec2 cpu utilization"
          alarm_actions       = [aws_autoscaling_policy.scale_up.arn]
          
          dimensions = {
            AutoScalingGroupName = aws_autoscaling_group.web.name
          }
        }
        
        resource "aws_cloudwatch_metric_alarm" "cpu_low" {
          alarm_name          = "${var.name_prefix}-cpu-low"
          comparison_operator = "LessThanThreshold"
          evaluation_periods  = "2"
          metric_name         = "CPUUtilization"
          namespace           = "AWS/EC2"
          period              = "300"
          statistic           = "Average"
          threshold           = "20"
          alarm_description   = "This metric monitors ec2 cpu utilization"
          alarm_actions       = [aws_autoscaling_policy.scale_down.arn]
          
          dimensions = {
            AutoScalingGroupName = aws_autoscaling_group.web.name
          }
        }
        COMPUTE_MAIN_EOF
        
