        cat << 'README_EOF' > README.md
        # Terraform Infrastructure
        
        This directory contains Terraform configuration for deploying cloud infrastructure following best practices and the Unix philosophy of simplicity and composability.
        
        ## 🏗️ Architecture Overview
        
        The infrastructure is organized into modular components:
        
        ```
        terraform/
        ├── main.tf              # Main configuration
        ├── variables.tf         # Input variables
        ├── outputs.tf          # Output values
        ├── versions.tf         # Provider versions
        ├── terraform.tfvars.example # Example variables
        ├── modules/            # Reusable modules
        │   ├── network/        # VPC, subnets, routing
        │   ├── security/       # Security groups, NACLs
        │   ├── compute/        # EC2, Auto Scaling
        │   └── storage/        # S3, EBS, etc.
        ├── environments/       # Environment-specific configs
        └── scripts/           # Utility scripts
        ```
        
        ## 🚀 Quick Start
        
        ### Prerequisites
        
        - Terraform >= 1.5.0
        - AWS CLI configured (for AWS deployments)
        - Appropriate cloud credentials
        
        ### Deployment Steps
        
        1. **Initialize Terraform**
           ```bash
           ./scripts/terraform.sh init
           ```
        
        2. **Copy and customize variables**
           ```bash
           cp terraform.tfvars.example terraform.tfvars
           # Edit terraform.tfvars with your values
           ```
        
        3. **Plan the deployment**
           ```bash
           ./scripts/terraform.sh plan
           ```
        
        4. **Apply the changes**
           ```bash
           ./scripts/terraform.sh apply
           ```
        
        ## 📁 Module Details
        
        ### Network Module
        - Creates VPC with public and private subnets
        - Configures Internet Gateway and NAT Gateways
        - Sets up route tables and associations
        - Follows AWS best practices for network segmentation
        
        ### Security Module
        - Defines security groups for different tiers
        - Implements least-privilege access patterns
        - Separates web, application, and database access
        - Includes load balancer security groups
        
        ### Compute Module
        - Auto Scaling Groups for high availability
        - Launch templates with user data
        - CloudWatch alarms for scaling
        - Instance health checks
        
        ## 🔧 Configuration
        
        ### Variables
        
        Key variables to customize:
        
        | Variable | Description | Default |
        |----------|-------------|---------|
        | `project_name` | Name of the project | `terraform-project` |
        | `environment` | Environment (dev/staging/prod) | `dev` |
        | `aws_region` | AWS region | `us-west-2` |
        | `vpc_cidr` | VPC CIDR block | `10.0.0.0/16` |
        | `instance_type` | EC2 instance type | `t3.micro` |
        
        ### Environments
        
        Environment-specific configurations can be managed using:
        - Separate `.tfvars` files
        - Terraform workspaces
        - Directory-based organization
        
        ## 🛡️ Security Best Practices
        
        This configuration implements several security best practices:
        
        - **Network Isolation**: Private subnets for application tier
        - **Least Privilege**: Minimal security group rules
        - **Encryption**: Encrypted storage and transit (where applicable)
        - **Monitoring**: CloudWatch integration for visibility
        - **Versioning**: Pinned provider versions for consistency
        
        ## 📊 Monitoring and Observability
        
        The infrastructure includes:
        - CloudWatch metrics and alarms
        - Auto Scaling based on CPU utilization
        - Instance health checks
        - Log aggregation capabilities
        
        ## 🔄 CI/CD Integration
        
        This Terraform configuration is designed to work with CI/CD pipelines:
        
        - Use `terraform plan` to preview changes
        - Store state in remote backend (S3 + DynamoDB)
        - Implement proper secret management
        - Use environment-specific deployments
        
        ## 🛠️ Utility Scripts
        
        ### `scripts/terraform.sh`
        Wrapper script for common Terraform operations:
        ```bash
        ./scripts/terraform.sh init     # Initialize
        ./scripts/terraform.sh plan     # Plan changes
        ./scripts/terraform.sh apply    # Apply changes
        ./scripts/terraform.sh destroy  # Destroy infrastructure
        ./scripts/terraform.sh validate # Validate configuration
        ./scripts/terraform.sh fmt      # Format files
        ```
        
        ### `scripts/pre-commit.sh`
        Pre-commit hook for code quality:
        - Terraform formatting validation
        - Configuration validation
        - Security scanning (if tfsec is available)
        
        ## 📚 Additional Resources
        
        - [Terraform Documentation](https://www.terraform.io/docs)
        - [AWS Provider Documentation](https://registry.terraform.io/providers/hashicorp/aws/latest/docs)
        - [Terraform Best Practices](https://www.terraform.io/docs/cloud/guides/recommended-practices/index.html)
        
        ## 🤝 Contributing
        
        1. Follow the Unix philosophy: small, focused, composable modules
        2. Use consistent naming conventions
        3. Document all variables and outputs
        4. Run pre-commit checks before committing
        5. Test changes in development environment first
        
        ## 📄 License
        
        This infrastructure code follows the principles of open systems and composability.
        
