name: Validate Process Configuration

on:
  pull_request:
    branches: [dev, uat, main]
    paths:
      - 'processes/**'
      - 'environments.json'

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    name: Validate & Dry-Run Diff
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go 1.21
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build adoproc CLI
        run: |
          go build -o adoproc ./cmd/adoproc/
          echo "adoproc built successfully"

      - name: Determine target environment
        id: env
        run: |
          if [[ "${{ github.base_ref }}" == "main" ]]; then
            echo "target=prod" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.base_ref }}" == "uat" ]]; then
            echo "target=uat" >> "$GITHUB_OUTPUT"
          else
            echo "target=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate configuration
        run: |
          echo "## Validation Results" >> "$GITHUB_STEP_SUMMARY"
          ./adoproc validate --env "${{ steps.env.outputs.target }}" | tee validation.json
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat validation.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Dry-run diff
        if: success()
        env:
          ADO_PAT: ${{ secrets.ADO_PAT }}
        run: |
          echo "## Drift Report (${{ steps.env.outputs.target }})" >> "$GITHUB_STEP_SUMMARY"
          ./adoproc diff --env "${{ steps.env.outputs.target }}" | tee diff.json || true
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat diff.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Comment PR with results
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let validation = 'No validation output';
            let diff = 'No diff output';
            try { validation = fs.readFileSync('validation.json', 'utf8'); } catch(e) {}
            try { diff = fs.readFileSync('diff.json', 'utf8'); } catch(e) {}
            const env = '${{ steps.env.outputs.target }}';
            const body = `## Process Config Validation — \`${env}\`
            
            <details><summary>Validation Result</summary>
            
            \`\`\`json
            ${validation}
            \`\`\`
            </details>
            
            <details><summary>Drift Analysis</summary>
            
            \`\`\`json
            ${diff}
            \`\`\`
            </details>`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
