name: Deploy to Dev

on:
  push:
    branches: [dev]
    paths:
      - 'processes/**'
      - 'environments.json'

permissions:
  contents: read

env:
  ADO_PAT: ${{ secrets.ADO_PAT }}

jobs:
  deploy-dev:
    name: Sync Process to Dev
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go 1.21
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build adoproc CLI
        run: go build -o adoproc ./cmd/adoproc/

      - name: Validate before deploy
        run: ./adoproc validate --env dev

      - name: Show planned changes (dry-run)
        run: ./adoproc sync --env dev --dry-run | tee dry-run.json

      - name: Apply changes to Dev
        run: |
          ./adoproc sync --env dev | tee sync-result.json
          echo "## Dev Sync Results" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat sync-result.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Generate drift report
        if: always()
        run: |
          ./adoproc report --output reports/dev-drift-report.html || true

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-drift-report
          path: reports/
          retention-days: 30
