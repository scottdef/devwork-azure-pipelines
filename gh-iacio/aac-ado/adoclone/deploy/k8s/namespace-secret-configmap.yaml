# Namespace, workload identity ServiceAccount, Key Vault SecretProviderClass
# and run settings for the adoclone Job. kubectl 1.30.
#
# The PAT lives in Azure Key Vault and is mounted as a file through the Secrets
# Store CSI driver with Microsoft Entra Workload ID (see docs/runbook.md for
# the one-time az commands). Replace the three <...> values first.
apiVersion: v1
kind: Namespace
metadata:
  name: adoclone
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: adoclone
  namespace: adoclone
  annotations:
    azure.workload.identity/client-id: "<workload-identity-client-id>"
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: adoclone-kv
  namespace: adoclone
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: "<workload-identity-client-id>"
    keyvaultName: "<key-vault-name>"
    tenantId: "<tenant-id>"
    objects: |
      array:
        - |
          objectName: ado-pat
          objectType: secret
          objectAlias: ado-pat
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: adoclone-config
  namespace: adoclone
data:
  ADO_ORG: CoolADO
  SOURCE: SourceProj
  TARGET: TargetProj
  COMPONENTS: all
  DRY_RUN: "true"
  LOG_LEVEL: info
