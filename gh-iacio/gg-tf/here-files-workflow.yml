name: Here-Files Generator
on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: 'Target repository (owner/repo-name)'
        required: true
        type: string
      branch_name:
        description: 'Branch name for changes'
        required: false
        default: 'feature/here-files-update'
        type: string
      commit_message:
        description: 'Commit message'
        required: false
        default: 'Generate here-files with heredoc automation'
        type: string

env:
  TARGET_REPO: ${{ inputs.target_repo }}
  BRANCH_NAME: ${{ inputs.branch_name }}
  COMMIT_MSG: ${{ inputs.commit_message }}

jobs:
  generate-here-files:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    
    steps:
    - name: Validate inputs
      run: |
        if [[ -z "$TARGET_REPO" ]]; then
          echo "Error: target_repo is required"
          exit 1
        fi
        if [[ ! "$TARGET_REPO" =~ ^[a-zA-Z0-9_.-]+/[a-zA-Z0-9_.-]+$ ]]; then
          echo "Error: target_repo must be in format 'owner/repo-name'"
          exit 1
        fi
        echo "✓ Target repo: $TARGET_REPO"
        echo "✓ Branch: $BRANCH_NAME"

    - name: Generate GitHub token for target repo
      id: app_token
      uses: actions/create-github-app-token@v1
      with:
        app-id: ${{ vars.APP_ID }}
        private-key: ${{ secrets.APP_PRIVATE_KEY }}
        owner: ${{ split(env.TARGET_REPO, '/')[0] }}

    - name: Clone target repository
      run: |
        echo "Cloning $TARGET_REPO..."
        git clone "https://x-access-token:${{ steps.app_token.outputs.token }}@github.com/$TARGET_REPO.git" target-repo
        cd target-repo
        
        # Set git config for commits
        git config user.name "here-files-bot[bot]"
        git config user.email "here-files-bot[bot]@users.noreply.github.com"
        
        # Show repo info
        echo "Repository cloned successfully:"
        pwd
        ls -la

    - name: Create and switch to feature branch
      working-directory: target-repo
      run: |
        echo "Creating branch: $BRANCH_NAME"
        git checkout -b "$BRANCH_NAME"
        git branch -v

    - name: Ensure here-files directory exists
      working-directory: target-repo
      run: |
        if [[ ! -d "here-files" ]]; then
          echo "Creating here-files directory..."
          mkdir -p here-files
          echo "✓ here-files directory created"
        else
          echo "✓ here-files directory already exists"
        fi

    - name: Generate files with heredoc magic
      working-directory: target-repo/here-files
      run: |
        echo "Generating files with the power of heredoc..."
        
        # Generate a system info script
        cat << 'SYSINFO_EOF' > system-info.sh
        #!/bin/bash
        # System Information Gatherer
        # Generated by the here-files automation
        
        echo "=== System Information ==="
        echo "Hostname: $(hostname)"
        echo "Kernel: $(uname -r)"
        echo "Architecture: $(uname -m)"
        echo "Uptime: $(uptime)"
        echo "Date: $(date)"
        echo
        echo "=== Memory Usage ==="
        free -h
        echo
        echo "=== Disk Usage ==="
        df -h /
        echo
        echo "=== Load Average ==="
        cat /proc/loadavg 2>/dev/null || echo "Load average not available"
        SYSINFO_EOF
        
        chmod +x system-info.sh
        
        # Generate a configuration template
        cat << 'CONFIG_EOF' > app-config.yaml
        # Application Configuration
        # Auto-generated by here-files system
        
        application:
          name: "here-files-app"
          version: "1.0.0"
          environment: "production"
        
        server:
          host: "0.0.0.0"
          port: 8080
          timeout: 30s
        
        database:
          driver: "postgres"
          host: "${DB_HOST:-localhost}"
          port: "${DB_PORT:-5432}"
          name: "${DB_NAME:-appdb}"
          user: "${DB_USER:-app}"
          password: "${DB_PASSWORD:-}"
          ssl_mode: "${DB_SSL_MODE:-disable}"
        
        logging:
          level: "${LOG_LEVEL:-info}"
          format: "json"
          output: "stdout"
        
        features:
          metrics_enabled: true
          tracing_enabled: false
          debug_mode: false
        CONFIG_EOF
        
        # Generate a Makefile (because real programmers use make)
        cat << 'MAKE_EOF' > Makefile
        # Makefile for here-files project
        # The Unix way of building things
        
        .PHONY: all build test clean install help
        
        # Default target
        all: build
        
        # Build the application
        build:
        	@echo "Building application..."
        	@mkdir -p bin
        	@echo "Build complete."
        
        # Run tests
        test:
        	@echo "Running tests..."
        	@echo "All tests passed."
        
        # Clean build artifacts
        clean:
        	@echo "Cleaning build artifacts..."
        	@rm -rf bin/ *.o *.so
        	@echo "Clean complete."
        
        # Install the application
        install: build
        	@echo "Installing application..."
        	@echo "Installation complete."
        
        # Show help
        help:
        	@echo "Available targets:"
        	@echo "  all     - Build the application (default)"
        	@echo "  build   - Build the application"
        	@echo "  test    - Run tests"
        	@echo "  clean   - Clean build artifacts"
        	@echo "  install - Install the application"
        	@echo "  help    - Show this help message"
        MAKE_EOF
        
        # Generate a Plan 9 style rc script (because we're Rob Pike and Ken Thompson)
        cat << 'RC_EOF' > init.rc
        #!/bin/rc
        # Plan 9 style initialization script
        # Because sometimes you need the elegance of rc shell
        
        fn usage {
        	echo 'usage:' $0 '[-v] [-h] [command]'
        	echo '  -v    verbose mode'
        	echo '  -h    show help'
        	echo '  command can be: start, stop, restart, status'
        }
        
        fn log {
        	echo `{date} $*
        }
        
        fn start {
        	log 'Starting service...'
        	# Service startup logic here
        	log 'Service started successfully'
        }
        
        fn stop {
        	log 'Stopping service...'
        	# Service shutdown logic here
        	log 'Service stopped'
        }
        
        fn restart {
        	stop
        	start
        }
        
        fn status {
        	log 'Checking service status...'
        	echo 'Service is running' # Replace with actual status check
        }
        
        # Main execution
        switch($1) {
        case start
        	start
        case stop
        	stop
        case restart
        	restart
        case status
        	status
        case -h
        	usage
        case ''
        	echo 'No command specified. Use -h for help.'
        case *
        	echo 'Unknown command:' $1
        	usage
        	exit 1
        }
        RC_EOF
        
        chmod +x init.rc
        
        # Generate a README for the here-files
        cat << 'README_EOF' > README.md
        # Here-Files Directory
        
        This directory contains files auto-generated by the here-files automation system.
        
        ## Generated Files
        
        - `system-info.sh` - System information gathering script
        - `app-config.yaml` - Application configuration template
        - `Makefile` - Build automation (the Unix way)
        - `init.rc` - Plan 9 style initialization script
        - `README.md` - This file
        
        ## Usage
        
        ```bash
        # Run system info script
        ./system-info.sh
        
        # Build with make
        make help
        make build
        
        # Use the rc script (if you have Plan 9 or 9base installed)
        ./init.rc start
        ```
        
        ## Philosophy
        
        These files embody the Unix philosophy:
        - Small, focused tools
        - Text-based configuration
        - Composable components
        - Simple, clear interfaces
        
        Generated with heredoc automation - because sometimes the old ways are the best ways.
        README_EOF
        
        echo "✓ Files generated successfully:"
        ls -la

    - name: Verify generated files
      working-directory: target-repo/here-files
      run: |
        echo "Verifying generated files..."
        
        # Check that all expected files exist
        expected_files=("system-info.sh" "app-config.yaml" "Makefile" "init.rc" "README.md")
        for file in "${expected_files[@]}"; do
          if [[ -f "$file" ]]; then
            echo "✓ $file exists ($(stat -c%s "$file") bytes)"
          else
            echo "✗ $file missing"
            exit 1
          fi
        done
        
        # Verify executable permissions
        if [[ -x "system-info.sh" && -x "init.rc" ]]; then
          echo "✓ Executable permissions set correctly"
        else
          echo "✗ Executable permissions not set"
          exit 1
        fi

    - name: Add files to git
      working-directory: target-repo
      run: |
        echo "Adding files to git..."
        git add here-files/
        
        # Show what we're about to commit
        echo "Files to be committed:"
        git diff --cached --name-status

    - name: Commit changes
      working-directory: target-repo
      run: |
        echo "Committing changes..."
        
        # Check if there are changes to commit
        if git diff --cached --quiet; then
          echo "No changes to commit"
          exit 0
        fi
        
        # Create detailed commit message
        commit_msg="$COMMIT_MSG
        
        Generated files:
        - system-info.sh: System information gathering script
        - app-config.yaml: Application configuration template  
        - Makefile: Build automation
        - init.rc: Plan 9 style initialization script
        - README.md: Documentation
        
        Auto-generated via GitHub Actions workflow
        Target repo: $TARGET_REPO
        Branch: $BRANCH_NAME"
        
        git commit -m "$commit_msg"
        echo "✓ Changes committed successfully"

    - name: Push to branch
      working-directory: target-repo
      run: |
        echo "Pushing to branch: $BRANCH_NAME"
        git push origin "$BRANCH_NAME"
        echo "✓ Branch pushed successfully"

    - name: Create Pull Request
      working-directory: target-repo
      env:
        GH_TOKEN: ${{ steps.app_token.outputs.token }}
      run: |
        echo "Creating pull request..."
        
        # Create PR with detailed description
        pr_body="## Here-Files Generation
        
        This PR contains auto-generated files in the \`here-files/\` directory.
        
        ### Generated Files
        - 📄 \`system-info.sh\` - System information gathering script
        - ⚙️  \`app-config.yaml\` - Application configuration template
        - 🔨 \`Makefile\` - Build automation (the Unix way)
        - 🐚 \`init.rc\` - Plan 9 style initialization script  
        - 📖 \`README.md\` - Documentation
        
        ### Philosophy
        These files embody the Unix philosophy of small, focused tools that compose well together.
        
        ### Automation Details
        - **Target Repository:** \`$TARGET_REPO\`
        - **Branch:** \`$BRANCH_NAME\`
        - **Generated:** \$(date -u)
        - **Workflow:** \`${{ github.workflow }}\`
        - **Run ID:** \`${{ github.run_id }}\`
        
        Generated with heredoc automation - because sometimes the old ways are the best ways.
        
        ---
        *This PR was created automatically by the here-files generator workflow.*"
        
        gh pr create \
          --title "feat: Add here-files directory with generated utilities" \
          --body "$pr_body" \
          --base main \
          --head "$BRANCH_NAME" \
          --label "automation,enhancement"
        
        echo "✓ Pull request created successfully"
        
        # Show PR URL
        pr_url=$(gh pr view "$BRANCH_NAME" --json url --jq '.url')
        echo "🔗 Pull Request URL: $pr_url"

    - name: Workflow summary
      working-directory: target-repo
      run: |
        echo "## Workflow Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "✅ **Target Repository:** \`$TARGET_REPO\`" >> $GITHUB_STEP_SUMMARY
        echo "✅ **Branch Created:** \`$BRANCH_NAME\`" >> $GITHUB_STEP_SUMMARY
        echo "✅ **Files Generated:** 5 files in \`here-files/\` directory" >> $GITHUB_STEP_SUMMARY
        echo "✅ **Changes Committed and Pushed**" >> $GITHUB_STEP_SUMMARY
        echo "✅ **Pull Request Created**" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Generated Files" >> $GITHUB_STEP_SUMMARY
        echo "- 📄 \`system-info.sh\` - System information script" >> $GITHUB_STEP_SUMMARY
        echo "- ⚙️ \`app-config.yaml\` - Configuration template" >> $GITHUB_STEP_SUMMARY  
        echo "- 🔨 \`Makefile\` - Build automation" >> $GITHUB_STEP_SUMMARY
        echo "- 🐚 \`init.rc\` - Plan 9 style script" >> $GITHUB_STEP_SUMMARY
        echo "- 📖 \`README.md\` - Documentation" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "*The Unix philosophy lives on through automation.*" >> $GITHUB_STEP_SUMMARY