name: Organization Settings Drift Detection

on:
  schedule:
    # Run hourly at minute 0
    - cron: '0 * * * *'
  
  # Allow manual trigger for testing
  workflow_dispatch:
    inputs:
      skip_remediation:
        description: 'Skip auto-remediation (plan only)'
        required: false
        type: boolean
        default: false

env:
  TF_VERSION: '1.5.0'
  WORKING_DIR: '.'

jobs:
  detect-and-remediate:
    name: Detect and Auto-Remediate Drift
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      
      - name: Terraform Init
        working-directory: ${{ env.WORKING_DIR }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_ORG_ADMIN_TOKEN }}
          GITHUB_OWNER: ${{ github.repository_owner }}
        run: terraform init
      
      - name: Terraform Plan
        id: plan
        working-directory: ${{ env.WORKING_DIR }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_ORG_ADMIN_TOKEN }}
          GITHUB_OWNER: ${{ github.repository_owner }}
        run: |
          set +e
          terraform plan -detailed-exitcode -no-color -out=tfplan > plan_output.txt 2>&1
          PLAN_EXIT_CODE=$?
          echo "exitcode=$PLAN_EXIT_CODE" >> $GITHUB_OUTPUT
          cat plan_output.txt
          exit 0
        continue-on-error: true
      
      - name: Check for Organization Settings Drift
        id: check_drift
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          # Exit code 2 means changes detected
          if [ "${{ steps.plan.outputs.exitcode }}" == "2" ]; then
            # Check if organization_settings resource has changes
            if grep -q "github_organization_settings.main" plan_output.txt; then
              echo "drift_detected=true" >> $GITHUB_OUTPUT
              echo "🚨 Drift detected in organization_settings"
              
              # Extract the drift section
              sed -n '/# github_organization_settings.main/,/^Plan:/p' plan_output.txt > drift_section.txt
              
            else
              echo "drift_detected=false" >> $GITHUB_OUTPUT
              echo "✓ Changes detected but not in organization_settings"
            fi
          else
            echo "drift_detected=false" >> $GITHUB_OUTPUT
            echo "✓ No drift detected"
          fi
      
      - name: Create Drift Issue
        if: steps.check_drift.outputs.drift_detected == 'true'
        id: create_issue
        uses: actions/github-script@v7
        env:
          PLAN_OUTPUT: ${{ steps.plan.outputs.stdout }}
        with:
          script: |
            const fs = require('fs');
            const planOutput = fs.readFileSync('plan_output.txt', 'utf8');
            const driftSection = fs.readFileSync('drift_section.txt', 'utf8');
            
            // Format the issue body
            const issueBody = `# 🚨 Organization Settings Drift Detected
            
            **Organization**: \`${{ github.repository_owner }}\`
            **Detection Time**: ${new Date().toUTCString()}
            **Workflow Run**: [View Details](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            
            ---
            
            ## 📊 Drift Summary
            
            Terraform has detected that the GitHub organization settings have drifted from the configuration defined in \`terraform.tfvars\`.
            
            **Auto-remediation**: ⏳ In progress...
            
            ---
            
            ## 🔍 Terraform Plan Output
            
            <details>
            <summary>Click to expand full plan output</summary>
            
            \`\`\`hcl
            ${driftSection}
            \`\`\`
            
            </details>
            
            ---
            
            ## 🔧 What's Happening
            
            1. ✅ Drift detected via \`terraform plan\`
            2. ✅ This issue created automatically
            3. ⏳ Running \`terraform apply\` to remediate...
            4. ⏳ Will comment here with results
            
            ---
            
            ## 📚 More Information
            
            - **Documentation**: See [DRIFT_DETECTION.md](../blob/main/DRIFT_DETECTION.md)
            - **Manual Review**: If auto-remediation fails, run \`make plan\` locally
            - **Disable Auto-Remediation**: Modify workflow to skip apply step
            
            ---
            
            *Auto-generated by Organization Settings Drift Detection workflow*`;
            
            // Look for existing open drift issue
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'drift-detection,organization-settings',
              per_page: 100
            });
            
            const existingIssue = issues.data.find(issue => 
              issue.title.includes('Organization Settings Drift Detected')
            );
            
            let issueNumber;
            
            if (existingIssue) {
              // Update existing issue
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: issueBody,
                state: 'open'
              });
              
              issueNumber = existingIssue.number;
              console.log(`Updated existing issue #${issueNumber}`);
            } else {
              // Create new issue
              const issue = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '🚨 Organization Settings Drift Detected',
                body: issueBody,
                labels: ['drift-detection', 'organization-settings', 'terraform', 'auto-remediation']
              });
              
              issueNumber = issue.data.number;
              console.log(`Created new issue #${issueNumber}`);
            }
            
            core.setOutput('issue_number', issueNumber);
            return issueNumber;
      
      - name: Terraform Apply (Auto-Remediation)
        if: steps.check_drift.outputs.drift_detected == 'true' && github.event.inputs.skip_remediation != 'true'
        id: apply
        working-directory: ${{ env.WORKING_DIR }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_ORG_ADMIN_TOKEN }}
          GITHUB_OWNER: ${{ github.repository_owner }}
        run: |
          set +e
          terraform apply -auto-approve -no-color tfplan > apply_output.txt 2>&1
          APPLY_EXIT_CODE=$?
          echo "exitcode=$APPLY_EXIT_CODE" >> $GITHUB_OUTPUT
          cat apply_output.txt
          exit 0
        continue-on-error: true
      
      - name: Comment on Issue - Success
        if: steps.check_drift.outputs.drift_detected == 'true' && steps.apply.outputs.exitcode == '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const applyOutput = fs.readFileSync('apply_output.txt', 'utf8');
            
            const comment = `## ✅ Auto-Remediation Successful
            
            **Completed**: ${new Date().toUTCString()}
            **Status**: Success
            
            The drift has been automatically remediated. GitHub organization settings now match the Terraform configuration.
            
            ### 📋 Apply Output
            
            <details>
            <summary>Click to expand apply output</summary>
            
            \`\`\`
            ${applyOutput}
            \`\`\`
            
            </details>
            
            ### ✅ Next Steps
            
            - Drift has been resolved automatically
            - Organization settings now match \`terraform.tfvars\`
            - This issue will remain open for review
            - Close this issue if remediation is confirmed
            
            ### 🔍 Review Changes
            
            To verify the changes:
            \`\`\`bash
            make show  # View current state
            make plan  # Should show no changes
            \`\`\`
            
            ---
            
            *Auto-remediation completed successfully*`;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ steps.create_issue.outputs.result }},
              body: comment
            });
            
            // Add success label
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ steps.create_issue.outputs.result }},
              labels: ['remediation-success']
            });
      
      - name: Comment on Issue - Failure
        if: steps.check_drift.outputs.drift_detected == 'true' && steps.apply.outputs.exitcode != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const applyOutput = fs.readFileSync('apply_output.txt', 'utf8');
            
            const comment = `## ❌ Auto-Remediation Failed
            
            **Completed**: ${new Date().toUTCString()}
            **Status**: Failure
            **Exit Code**: ${{ steps.apply.outputs.exitcode }}
            
            The automatic remediation attempt failed. Manual intervention required.
            
            ### 📋 Apply Output
            
            <details>
            <summary>Click to expand apply output</summary>
            
            \`\`\`
            ${applyOutput}
            \`\`\`
            
            </details>
            
            ### 🔧 Manual Remediation Required
            
            1. **Review the error output above**
            2. **Run locally for debugging**:
               \`\`\`bash
               export GITHUB_TOKEN="your-token"
               export GITHUB_OWNER="${{ github.repository_owner }}"
               make plan
               make apply
               \`\`\`
            
            3. **Common issues**:
               - Token permissions insufficient
               - API rate limit reached
               - Network/connectivity issues
               - Invalid configuration values
            
            ### 🚨 Action Required
            
            - This drift must be manually resolved
            - Check GitHub audit logs for unexpected changes
            - Verify \`terraform.tfvars\` is correct
            - Re-run workflow after fixing issues
            
            ---
            
            *Auto-remediation failed - manual intervention needed*`;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ steps.create_issue.outputs.result }},
              body: comment
            });
            
            // Add failure label and mark as high priority
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ steps.create_issue.outputs.result }},
              labels: ['remediation-failed', 'priority-high']
            });
      
      - name: Close Issue if No Drift
        if: steps.check_drift.outputs.drift_detected == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            // Look for existing open drift issue
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'drift-detection,organization-settings',
              per_page: 100
            });
            
            const existingIssue = issues.data.find(issue => 
              issue.title.includes('Organization Settings Drift Detected')
            );
            
            if (existingIssue) {
              // Close the issue with a comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: `## ✅ Drift Resolved
                
                **Verified**: ${new Date().toUTCString()}
                **Status**: No drift detected
                
                Organization settings now match Terraform configuration. Closing this issue.
                
                ---
                
                *Verified by drift detection workflow run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}*`
              });
              
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                state: 'closed'
              });
              
              console.log(`Closed drift issue #${existingIssue.number}`);
            } else {
              console.log('No open drift issue found');
            }
      
      - name: Cleanup
        if: always()
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          rm -f plan_output.txt
          rm -f apply_output.txt
          rm -f drift_section.txt
          rm -f tfplan
